<!--
  EXO·OPS inner content component (loaded by the thin surface-panel wrapper via
  <x-component path="/plugins/_exocortex/webui/exo-ops-content.html">).
  v1.20 canvas contract: x-data lives HERE (on a div inside the nested
  x-component), NOT on the .right-canvas-surface-panel root — putting x-data on
  the surface-panel root collapses it to 0x0 and lets content escape the box.
  Mirrors the working Intelligence panel structure.
-->
<div class="xops" x-data>
<style>
.xops {
  --void:#03070c; --base:#06101a; --raised:#0d1c2b; --raised-2:#12243a;
  --line:rgba(80,180,235,.26); --line-b:rgba(120,215,255,.55); --edge-hi:rgba(150,230,255,.30);
  --ink:#cdeeff; --dim:#6ba6ca; --faint:#3d6f8c;
  --accent:#27b6ff; --accent-2:#6fe0ff; --good:#46e8b0; --warn:#ffd25a; --crit:#ff6a5a;
  --glow:0 0 8px rgba(40,180,255,.45);
  --mono:'Share Tech Mono',ui-monospace,'JetBrains Mono','Consolas',monospace;
  --read:'Rajdhani','Inter',system-ui,sans-serif;
  display:flex; flex-direction:column; width:100%; height:100%;
  background:radial-gradient(130% 80% at 75% -10%, rgba(12,44,66,.45), transparent 60%), var(--base);
  color:var(--ink); font-family:var(--mono); font-size:13px; overflow:hidden; letter-spacing:.02em;
}
.xops-header { display:flex; align-items:center; gap:8px; padding:10px 12px; background:var(--void); border-bottom:1px solid var(--line); flex-shrink:0; }
.xops-mark { font-family:var(--read); font-weight:700; font-size:13px; letter-spacing:.22em; color:var(--accent-2); text-shadow:var(--glow); white-space:nowrap; }
.xops-sub { font-size:8.5px; letter-spacing:.18em; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.xops-dot { width:8px; height:8px; border-radius:50%; background:var(--faint); margin-left:auto; flex-shrink:0; transition:.3s; }
.xops-dot.on { background:var(--good); box-shadow:0 0 7px var(--good); animation:xpulse 1.8s infinite; }
.xops-dot.off { background:var(--crit); box-shadow:0 0 7px var(--crit); }
@keyframes xpulse { 0%,100%{opacity:1} 50%{opacity:.3} }

.xops-body { flex:1; min-height:0; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:11px; }
.xops-body::-webkit-scrollbar { width:8px; } .xops-body::-webkit-scrollbar-thumb { background:var(--line); }

.xops-ctl { border:1px solid var(--line-b); background:var(--raised); box-shadow:inset 0 1px 0 var(--edge-hi); padding:12px; display:flex; flex-direction:column; gap:9px; border-radius:4px; }
.xops-ctl.on { border-color:rgba(70,232,176,.45); }
.xops-ctl.off { border-color:rgba(255,106,90,.4); }
.xops-ctl-head { display:flex; align-items:center; gap:8px; }
.xops-ctl-head .ico { font-size:17px; line-height:1; flex-shrink:0; }
.xops-ctl-head .label { font-family:var(--read); font-size:12.5px; font-weight:700; letter-spacing:.12em; }
.xops-ctl.on .label { color:var(--good); } .xops-ctl.off .label { color:var(--crit); }
.xops-ctl-desc { font-size:10px; color:var(--dim); line-height:1.45; }
.xops-btn { width:100%; padding:8px; text-align:center; font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.12em; cursor:pointer; border:1px solid; background:transparent; transition:.15s; border-radius:3px; }
.xops-btn.en { border-color:rgba(70,232,176,.5); color:var(--good); } .xops-btn.en:hover { background:rgba(70,232,176,.14); }
.xops-btn.dis { border-color:rgba(255,106,90,.5); color:var(--crit); } .xops-btn.dis:hover { background:rgba(255,106,90,.14); }
.xops-pause { display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding-top:9px; border-top:1px solid var(--line); font-size:10px; color:var(--dim); }
.xops-pause > .lbl { letter-spacing:.1em; }
.xops-sel { background:var(--raised-2); border:1px solid var(--line); color:var(--ink); padding:4px 7px; font-family:var(--mono); font-size:10px; cursor:pointer; border-radius:3px; }
.xops-btn-sm { flex:1; min-width:64px; font-family:var(--mono); font-size:10px; letter-spacing:.06em; padding:5px 8px; cursor:pointer; border:1px solid var(--line-b); background:var(--raised-2); color:var(--ink); transition:.13s; border-radius:3px; }
.xops-btn-sm:hover { background:var(--accent); color:var(--void); }
.xops-btn-sm.resume { border-color:rgba(70,232,176,.5); color:var(--good); }
.xops-until { color:var(--warn); font-family:var(--mono); font-size:10px; flex:1; }

.xops-status { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.xops-badge { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; font-family:var(--mono); font-size:9px; font-weight:600; letter-spacing:.1em; border:1px solid; text-transform:uppercase; border-radius:3px; }
.b-idle{ color:var(--good); border-color:rgba(70,232,176,.4);} .b-working{ color:var(--accent-2); border-color:var(--line-b);}
.b-paused,.b-cooldown{ color:var(--warn); border-color:rgba(255,210,90,.4);} .b-disabled{ color:var(--faint); border-color:var(--line);}
.xops-aux { font-size:9.5px; color:var(--faint); font-family:var(--mono); }
.xops-stats { display:grid; grid-template-columns:repeat(2,1fr); gap:7px; }
.xops-stat { border:1px solid var(--line); background:var(--raised); padding:9px 8px; position:relative; border-radius:3px; }
.xops-stat::before { content:''; position:absolute; left:0; top:0; width:2px; height:100%; background:var(--accent); opacity:.5; }
.xops-stat .v { font-family:var(--mono); font-size:18px; color:var(--ink); text-shadow:var(--glow); line-height:1; }
.xops-stat .l { font-size:8.5px; color:var(--faint); margin-top:3px; letter-spacing:.1em; text-transform:uppercase; }

.xops-seclabel { font-family:var(--mono); font-size:9px; font-weight:600; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); display:flex; justify-content:space-between; gap:6px; }

.xops-feed { display:flex; flex-direction:column; gap:6px; }
.xcard { border:1px solid var(--line); background:var(--raised); transition:border-color .15s, background .15s; border-radius:3px; }
.xcard:hover { border-color:var(--line-b); }
.xcard.open { border-color:var(--line-b); box-shadow:inset 0 0 14px rgba(50,170,240,.12); }
.xrow { display:flex; align-items:center; gap:8px; padding:8px 10px; cursor:pointer; }
.xrow .chev { color:var(--faint); font-size:8.5px; flex-shrink:0; transition:transform .3s cubic-bezier(.2,.8,.2,1), color .2s; }
.xcard.open .xrow .chev { transform:rotate(90deg); color:var(--accent-2); }
.xrow .kind { font-family:var(--mono); font-size:8px; letter-spacing:.08em; padding:2px 6px; border:1px solid var(--line); flex-shrink:0; border-radius:2px; }
.xrow .kind.build { color:var(--good); border-color:rgba(70,232,176,.4); }
.xrow .kind.explore { color:var(--accent-2); border-color:rgba(111,224,255,.4); }
.xrow .kind.maintain { color:var(--dim); }
.xrow .nm { flex:1; min-width:0; font-size:11px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.xrow .nm small { color:var(--faint); font-family:var(--mono); font-size:9px; margin-left:5px; }
.xrow .res { font-size:11px; flex-shrink:0; }
.res-ok{ color:var(--good);} .res-int{ color:var(--warn);} .res-err{ color:var(--crit);}
.xreport { max-height:0; overflow:hidden; opacity:0; transition:max-height .4s cubic-bezier(.2,.85,.25,1), opacity .3s; }
.xcard.open .xreport { max-height:360px; opacity:1; }
.xrep { padding:2px 11px 12px 24px; }
.xrep .obj { font-size:10.5px; line-height:1.5; color:var(--accent-2); margin-bottom:9px; }
.xrep .rh { font-size:8.5px; letter-spacing:.16em; color:var(--faint); margin:9px 0 6px; text-transform:uppercase; }
.xchips { display:flex; flex-wrap:wrap; gap:5px; }
.xchip { border:1px solid var(--line); background:var(--raised-2); padding:4px 7px; font-size:9px; border-radius:2px; }
.xchip .k { color:var(--dim); } .xchip .vv { color:var(--ink); margin-left:5px; } .xchip.hot .vv { color:var(--good); }
.xrep .jr { border:1px solid var(--line); background:rgba(0,0,0,.22); padding:8px 10px; font-size:10px; line-height:1.5; color:var(--dim); font-style:italic; margin-top:4px; border-radius:2px; }
.xcard.open .xrep > * { animation:xin .35s ease both; }
.xcard.open .xrep > *:nth-child(2){animation-delay:.05s} .xcard.open .xrep > *:nth-child(3){animation-delay:.1s} .xcard.open .xrep > *:nth-child(4){animation-delay:.15s}
@keyframes xin { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:translateY(0)} }

.xops-empty { text-align:center; padding:30px 6px; color:var(--faint); font-size:11px; line-height:1.5; }
.xops-err { text-align:center; padding:16px 6px; color:var(--crit); font-size:10.5px; line-height:1.5; }
.xops-note { font-size:8px; color:var(--faint); letter-spacing:.08em; text-align:center; padding-top:2px; }
</style>

<div class="xops-header">
  <span class="xops-mark">EXO·OPS</span>
  <span class="xops-sub" id="xops-sub">作戦管制</span>
  <span class="xops-dot off" id="xops-dot"></span>
</div>
<div class="xops-body" id="xops-body"><div class="xops-empty">Acquiring feed…</div></div>

<script>
(function(){
  const FEED='/api/plugins/_exocortex/office_feed', CTRL='/api/plugins/_exocortex/idle_control';
  let openCycle=null, timer=null;
  setTimeout(function init(){
    const root=document.querySelector('.xops');
    if(!root){ setTimeout(init,50); return; }
    const body=root.querySelector('#xops-body'), dot=root.querySelector('#xops-dot'), sub=root.querySelector('#xops-sub');
    if(!body){ setTimeout(init,50); return; }

    function fmtT(iso){ if(!iso) return '—'; try{ return new Date(iso).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }catch(e){ return iso; } }

    async function control(action, extra){
      try{ const r=await fetch(CTRL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({action},extra||{}))});
        if(!r.ok) throw new Error('HTTP '+r.status); await render(); }
      catch(e){ console.error('[EXO·OPS] control',e); }
    }
    window.xopsControl=(a,x)=>control(a,x);
    window.xopsToggle=(n)=>{ openCycle = (openCycle===n)?null:n; render(); };

    function report(e){
      const k=(e.cycle_type||'maintain').toLowerCase();
      const obj = k==='build' ? 'BUILD cycle — deepen wiki knowledge toward STABLE.'
        : k==='explore' ? 'EXPLORE cycle — outbound research, stage findings.'
        : 'MAINTAIN cycle — integrity sweep, dedup, consolidation.';
      const chips=[
        ['STEPS', (e.steps_used!=null?e.steps_used:'—'), false],
        ['PAGES +', e.pages_deepened||0, (e.pages_deepened||0)>0],
        ['SKILLS +', e.skills_captured||0, (e.skills_captured||0)>0],
        ['MEM +', e.memories_saved||0, (e.memories_saved||0)>0],
        ['FIELD', e.field_reports||0, (e.field_reports||0)>0],
        ['SLEEP', e.sleep_findings||0, false],
        ['INTEG', (e.integrity_issues||0)===0?'OK':(e.integrity_issues+' ISS'), (e.integrity_issues||0)===0]
      ];
      const chipHtml=chips.map(c=>`<span class="xchip ${c[2]?'hot':''}"><span class="k">${c[0]}</span><span class="vv">${c[1]}</span></span>`).join('');
      return `<div class="xreport"><div class="xrep">
        <div class="obj">${obj}</div>
        <div class="rh">Outcomes</div><div class="xchips">${chipHtml}</div>
        <div class="rh">Activity Log</div><div class="jr">${(e.activity||'—')}</div>
      </div></div>`;
    }
    function row(e){
      const k=(e.cycle_type||'maintain').toLowerCase();
      const st=(e.status||'completed').toLowerCase();
      const rc=st==='completed'?'res-ok':st==='interrupted'?'res-int':'res-err';
      const ri=st==='completed'?'✓':st==='interrupted'?'↩':'⚡';
      const open=openCycle===e.cycle_number;
      return `<div class="xcard ${open?'open':''}">
        <div class="xrow" onclick="xopsToggle(${e.cycle_number})">
          <span class="chev">▶</span>
          <span class="kind ${k}">${k.toUpperCase()}</span>
          <span class="nm">#${e.cycle_number}<small>${fmtT(e.timestamp)}</small></span>
          <span class="res ${rc}">${ri}</span>
        </div>${report(e)}</div>`;
    }

    async function render(){
      try{
        const r=await fetch(FEED); if(!r.ok) throw new Error(r.status);
        const data=await r.json();
        const enabled=data.enabled!==undefined?data.enabled:false;
        const status=data.status||{}; const entries=data.entries||[];
        const state=enabled?(status.state||'idle').toLowerCase():'disabled';
        const total=data.total_cycles!=null?data.total_cycles:entries.length;

        dot.className='xops-dot '+(enabled&&state!=='disabled'?'on':'off');
        sub.textContent='作戦管制 · CYCLE '+(entries[0]?entries[0].cycle_number:total);

        const bcls={idle:'b-idle',working:'b-working',paused:'b-paused',cooldown:'b-cooldown',disabled:'b-disabled'}[state]||'b-disabled';
        const blab={idle:'Available',working:'Working',paused:'Paused',cooldown:'Cooldown',disabled:'Disabled'}[state]||state;
        let aux=''; if(state==='paused'&&status.paused_until) aux='until '+fmtT(status.paused_until); if(state==='working'&&status.started) aux='since '+fmtT(status.started);
        const isPaused=state==='paused';

        const pause = enabled ? `<div class="xops-pause">${isPaused
          ? `<span class="xops-until">⏸ Paused ${aux}</span><button class="xops-btn-sm resume" onclick="xopsControl('resume')">RESUME</button>`
          : `<span class="lbl">PAUSE</span>
             <select class="xops-sel" id="xops-dur"><option value="1800">30m</option><option value="3600" selected>1h</option><option value="7200">2h</option><option value="14400">4h</option><option value="28800">8h</option></select>
             <button class="xops-btn-sm" onclick="xopsControl('pause',{duration_seconds:+document.getElementById('xops-dur').value})">PAUSE</button>`}</div>` : '';

        const sumP=entries.reduce((s,e)=>s+(e.pages_deepened||0),0);
        const sumS=entries.reduce((s,e)=>s+(e.skills_captured||0),0);
        const sumM=entries.reduce((s,e)=>s+(e.memories_saved||0),0);

        body.innerHTML=`
          <div class="xops-ctl ${enabled?'on':'off'}">
            <div class="xops-ctl-head"><span class="ico">${enabled?'◉':'◯'}</span><span class="label">IDLE ENGINE ${enabled?'ONLINE':'OFFLINE'}</span></div>
            <div class="xops-ctl-desc">${enabled?'Autonomous cycles active — the agent works the knowledge base when idle.':'Disabled. No autonomous LLM calls are made.'}</div>
            <button class="xops-btn ${enabled?'dis':'en'}" onclick="xopsControl('${enabled?'disable':'enable'}')">${enabled?'DISABLE ENGINE':'ENABLE ENGINE'}</button>
            ${pause}
          </div>

          <div class="xops-status">
            <span class="xops-badge ${bcls}">⬤ ${blab}</span>
            ${aux&&!isPaused?`<span class="xops-aux">${aux}</span>`:''}
          </div>

          <div class="xops-stats">
            <div class="xops-stat"><div class="v">${total}</div><div class="l">Cycles</div></div>
            <div class="xops-stat"><div class="v">${sumP}</div><div class="l">Pages +</div></div>
            <div class="xops-stat"><div class="v">${sumS}</div><div class="l">Skills +</div></div>
            <div class="xops-stat"><div class="v">${sumM}</div><div class="l">Mem +</div></div>
          </div>

          <div class="xops-seclabel"><span>Cycle Log</span><span>${entries.length} shown</span></div>
          <div class="xops-feed">${entries.length?entries.map(row).join(''):'<div class="xops-empty">No cycles yet.<br>Enable the engine and step away.</div>'}</div>
          <div class="xops-note">LIVE · /api/plugins/_exocortex/office_feed · 20s</div>`;
      }catch(e){ body.innerHTML=`<div class="xops-err">Could not reach /api/plugins/_exocortex/office_feed<br>${e}</div>`; }
    }

    window.addEventListener('exo-ops-open', render);
    render();
    timer=setInterval(render,20000);
  },0);
})();
</script>
</div>

<html>
<head>
  <script type="module">
    import { store } from "/usr/plugins/exocortex/webui/theme-store.js";
    import { ThemeEditor } from "/usr/plugins/exocortex/webui/theme-editor.js";
    store.init();
    window.ThemeEditor = ThemeEditor;
  </script>
</head>
<body>
  <div x-data>
    <template x-if="$store.themeStore">
      <div class="theme-section" x-init="$store.themeStore.init()">

        <h3 class="theme-header">
          <span @click="$store.themeStore.togglePicker()"
                :class="{ 'collapsed': !$store.themeStore.pickerOpen }"
                class="theme-header-label">
            Themes
            <svg class="arrow-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
              <path d="M8 4l8 8-8 8" />
            </svg>
          </span>
          <button class="theme-edit-btn"
                  title="Edit active theme"
                  :disabled="!$store.themeStore.activeTheme"
                  :class="{ 'theme-edit-disabled': !$store.themeStore.activeTheme }"
                  @click.stop="$store.themeStore.activeTheme && window.ThemeEditor && window.ThemeEditor.open($store.themeStore.activeTheme)">
            ✏
          </button>
        </h3>

        <div x-show="$store.themeStore.pickerOpen" x-transition.duration.150ms class="theme-list">

          <!-- Default option -->
          <div class="theme-item"
               :class="{ 'theme-active': $store.themeStore.activeTheme === null }"
               @click="$store.themeStore.resetTheme()">
            <span class="theme-preview-dots">
              <span class="dot" style="background:#131313"></span>
              <span class="dot" style="background:#737a81"></span>
              <span class="dot" style="background:#cf6679"></span>
            </span>
            <span class="theme-name">Default</span>
          </div>

          <!-- Theme list from index.json (skip dark/light — covered by Default) -->
          <template x-for="theme in $store.themeStore.themes.filter(t => t.id !== 'dark' && t.id !== 'light')" :key="theme.id">
            <div class="theme-item"
                 :class="{ 'theme-active': $store.themeStore.isActive(theme.id) }"
                 @click="$store.themeStore.applyTheme(theme.id)"
                 :title="theme.description">
              <span class="theme-preview-dots">
                <span class="dot" :style="'background:' + theme.preview.background"></span>
                <span class="dot" :style="'background:' + theme.preview.text"></span>
                <span class="dot" :style="'background:' + theme.preview.accent"></span>
              </span>
              <span class="theme-name" x-text="theme.name"></span>
            </div>
          </template>

        </div>
      </div>
    </template>
  </div>

  <style>
    .theme-section {
      font-size: var(--font-size-small);
      padding: 0.6rem var(--spacing-md) 0.05rem var(--spacing-md);
    }

    .theme-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      margin: 0 0 0.2rem 0;
    }

    .theme-header-label {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      cursor: pointer;
      user-select: none;
      font-size: var(--font-size-small);
      font-weight: 600;
      color: var(--color-text);
      opacity: 0.85;
    }

    .arrow-icon {
      flex-shrink: 0;
      transform: rotate(90deg);
      transition: transform 0.2s ease;
      color: var(--color-primary);
    }

    .theme-header-label.collapsed .arrow-icon {
      transform: rotate(0deg);
    }

    .theme-edit-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--color-text-muted);
      font-size: 11px;
      padding: 1px 3px;
      opacity: 0.55;
      border-radius: 3px;
      line-height: 1;
      transition: opacity 0.15s, background 0.15s;
      flex-shrink: 0;
    }
    .theme-edit-btn:hover {
      opacity: 1;
      background: var(--color-secondary);
    }
    .theme-edit-btn.theme-edit-disabled {
      opacity: 0.2;
      cursor: not-allowed;
    }

    .theme-list {
      padding-bottom: 0.25rem;
    }

    .theme-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0.2rem 0.15rem;
      border-radius: 4px;
      cursor: pointer;
      opacity: 0.75;
      transition: opacity 0.15s ease, background-color 0.15s ease;
    }

    .theme-item:hover {
      opacity: 1;
      background-color: var(--color-background-hover);
    }

    .theme-item.theme-active {
      opacity: 1;
    }

    .theme-item.theme-active .theme-name {
      color: var(--color-text);
      font-weight: 500;
    }

    .theme-preview-dots {
      display: flex;
      gap: 3px;
      flex-shrink: 0;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .theme-name {
      font-size: 0.78rem;
      color: var(--color-primary);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</body>
</html>

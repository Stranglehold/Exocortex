    <text x="348" y="244">AREA: 34M2</text>
    <text x="348" y="258">DDC</text>
    <text x="348" y="272">LCTR</text>
    <text x="348" y="286">DIR: 13</text>
    <text x="348" y="312">5: 48°52'31"</text>

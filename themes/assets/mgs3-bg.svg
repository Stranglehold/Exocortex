    <line x1="340" y1="220" x2="340" y2="290"/>
    <line x1="340" y1="470" x2="340" y2="540"/>
    <line x1="860" y1="220" x2="860" y2="290"/>
    <line x1="860" y1="470" x2="860" y2="540"/>

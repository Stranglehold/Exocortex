    <line x1="495" y1="207" x2="495" y2="213"/>
    <line x1="530" y1="207" x2="530" y2="215"/>
    <line x1="565" y1="207" x2="565" y2="213"/>
    <line x1="600" y1="207" x2="600" y2="217"/>
    <line x1="635" y1="207" x2="635" y2="213"/>
    <line x1="670" y1="207" x2="670" y2="215"/>

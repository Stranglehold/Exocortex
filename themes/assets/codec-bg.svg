<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Codec background: worn field surface — sepia/organic texture -->
  <!-- Amber-brown palette on dark sepia base: visible through translucent panels -->
  <rect width="800" height="600" fill="#0e0c08"/>

  <!-- Diagonal texture lines — aged paper grain in amber-brown -->
  <line x1="0"   y1="0"   x2="600" y2="600" stroke="#8a5c28" stroke-width="0.9" opacity="0.30"/>
  <line x1="100" y1="0"   x2="700" y2="600" stroke="#8a5c28" stroke-width="0.9" opacity="0.30"/>
  <line x1="200" y1="0"   x2="800" y2="600" stroke="#8a5c28" stroke-width="0.9" opacity="0.28"/>
  <line x1="300" y1="0"   x2="800" y2="500" stroke="#7a5020" stroke-width="0.7" opacity="0.26"/>
  <line x1="0"   y1="100" x2="500" y2="600" stroke="#7a5020" stroke-width="0.7" opacity="0.26"/>
  <line x1="0"   y1="200" x2="400" y2="600" stroke="#7a5020" stroke-width="0.7" opacity="0.24"/>
  <line x1="400" y1="0"   x2="800" y2="400" stroke="#6a4418" stroke-width="0.6" opacity="0.22"/>
  <line x1="500" y1="0"   x2="800" y2="300" stroke="#6a4418" stroke-width="0.6" opacity="0.22"/>
  <line x1="600" y1="0"   x2="800" y2="200" stroke="#6a4418" stroke-width="0.6" opacity="0.20"/>
  <line x1="0"   y1="300" x2="300" y2="600" stroke="#6a4418" stroke-width="0.6" opacity="0.20"/>
  <line x1="0"   y1="400" x2="200" y2="600" stroke="#6a4418" stroke-width="0.6" opacity="0.18"/>

  <!-- Organic foliage shadow shapes — overlapping ellipses, irregular placement -->
  <!-- Upper-left canopy cluster -->
  <ellipse cx="80"  cy="90"  rx="120" ry="70"  fill="#6a4020" opacity="0.48"/>
  <ellipse cx="140" cy="60"  rx="90"  ry="55"  fill="#5a3418" opacity="0.42"/>
  <ellipse cx="50"  cy="140" rx="80"  ry="50"  fill="#602a10" opacity="0.38"/>
  <ellipse cx="200" cy="110" rx="70"  ry="45"  fill="#6a4020" opacity="0.32"/>

  <!-- Right edge foliage -->
  <ellipse cx="720" cy="80"  rx="110" ry="65"  fill="#6a4020" opacity="0.44"/>
  <ellipse cx="780" cy="140" rx="80"  ry="60"  fill="#5a2c10" opacity="0.38"/>
  <ellipse cx="660" cy="130" rx="75"  ry="50"  fill="#623418" opacity="0.34"/>
  <ellipse cx="750" cy="200" rx="90"  ry="55"  fill="#4e2810" opacity="0.30"/>

  <!-- Mid-frame scattered patches -->
  <ellipse cx="300" cy="200" rx="90"  ry="55"  fill="#5a3418" opacity="0.38"/>
  <ellipse cx="450" cy="170" rx="70"  ry="45"  fill="#6a4020" opacity="0.32"/>
  <ellipse cx="550" cy="220" rx="85"  ry="50"  fill="#4e2810" opacity="0.36"/>
  <ellipse cx="180" cy="280" rx="100" ry="60"  fill="#5c3014" opacity="0.34"/>
  <ellipse cx="620" cy="300" rx="90"  ry="55"  fill="#5a2c10" opacity="0.38"/>

  <!-- Ground-level patches — lower half -->
  <ellipse cx="100" cy="420" rx="130" ry="75"  fill="#6a4020" opacity="0.50"/>
  <ellipse cx="60"  cy="500" rx="100" ry="60"  fill="#5a3418" opacity="0.44"/>
  <ellipse cx="200" cy="480" rx="110" ry="65"  fill="#602a10" opacity="0.42"/>
  <ellipse cx="350" cy="460" rx="90"  ry="55"  fill="#4e2810" opacity="0.36"/>
  <ellipse cx="500" cy="500" rx="120" ry="70"  fill="#5c3014" opacity="0.48"/>
  <ellipse cx="650" cy="440" rx="100" ry="60"  fill="#6a4020" opacity="0.44"/>
  <ellipse cx="750" cy="520" rx="90"  ry="55"  fill="#5a2c10" opacity="0.38"/>
  <ellipse cx="420" cy="550" rx="130" ry="65"  fill="#4e2410" opacity="0.50"/>
  <ellipse cx="160" cy="560" rx="100" ry="50"  fill="#623418" opacity="0.40"/>

  <!-- Deep shadow pools — large organic forms -->
  <ellipse cx="400" cy="320" rx="220" ry="130" fill="#3c1c08" opacity="0.52"/>
  <ellipse cx="150" cy="350" rx="180" ry="110" fill="#341808" opacity="0.46"/>
  <ellipse cx="650" cy="400" rx="190" ry="120" fill="#3c1c08" opacity="0.50"/>
</svg>

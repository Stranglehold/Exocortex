<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>Agent Zero</title>
    <link rel="icon" type="image/svg+xml" href="public/favicon.svg">
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="css/messages.css">
    <link rel="stylesheet" href="components/messages/action-buttons/simple-action-buttons.css">
    <link rel="stylesheet" href="components/messages/process-group/process-group.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/modals.css">
    <link rel="stylesheet" href="css/speech.css">
    <link rel="stylesheet" href="css/scheduler-datepicker.css">
    <link rel="stylesheet" href="css/scheduler.css">
    <link rel="stylesheet" href="css/notification.css">
    <link rel="stylesheet" href="css/buttons.css">
    <link rel="stylesheet" href="css/tables.css">
    <link rel="stylesheet" href="css/artifact-panel.css">

    <!-- Flatpickr for datetime picker -->
    <link rel="stylesheet" href="vendor/flatpickr/flatpickr.min.css">
    <script src="vendor/flatpickr/flatpickr.min.js"></script>

    <script>
        globalThis.safeCall = function (name, ...args) {
            if (window[name]) window[name](...args)
        }
    </script>

    <script type="module" src="index.js"></script>

    <!-- Bootstrap JS (only for logic, importing bundled CSS => UI conflicts) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

    <!-- Then load Alpine.js -->
    <!-- <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.3/dist/cdn.min.js"></script> -->
    <script type="module" src="js/artifact-panel.js"></script>
    <script type="module" src="js/initFw.js"></script>

    <script src="vendor/ace-min/ace.js"></script>
    <link href="vendor/ace-min/ace.min.css" rel="stylesheet">
    <!-- KaTeX CSS -->
    <link rel="stylesheet" href="vendor/katex/katex.min.css" crossorigin="anonymous">

    <!-- KaTeX javascript -->
    <script defer src="vendor/katex/katex.min.js" crossorigin="anonymous"></script>
    <script defer src="vendor/katex/katex.auto-render.min.js" crossorigin="anonymous"></script>

    <!-- QR Code Library -->
    <script src="vendor/qrcode.min.js"></script>

    <!-- Google Icons -->
    <link rel="stylesheet" href="vendor/google/google-icons.css" />

    <!-- Link the PWA manifest file -->
    <link rel="manifest" href="js/manifest.json">

    <script>
        // Expose git info for sidebar component
        globalThis.gitinfo = { version: "{{version_no}}", commit_time: "{{version_time}}" };

        // Expose runtime info for frontend components (development gating, runtime-scoped cookies).
        globalThis.runtimeInfo = {
            ...(globalThis.runtimeInfo || {}),
            id: "{{runtime_id}}",
            isDevelopment: "{{runtime_is_development}}" === "true",
            loggedIn: "{{logged_in}}" === "true",
        };
    </script>
</head>

<body class="dark-mode device-pointer" x-data>
    <div class="container">
        <!-- Sidebar Overlay -->
        <div id="sidebar-overlay" x-data>
            <template x-if="$store.sidebar">
                <div class="sidebar-overlay" :class="{'visible': $store.sidebar.isOpen && $store.sidebar.isMobile()}" @click="$store.sidebar.close()"></div>
            </template>
        </div>
        <!-- Left Sidebar (Header Icons, Quick Actions, Tabs, Chats, Tasks) -->
        <x-component path="sidebar/left-sidebar.html"></x-component>

        <!-- Artifact Panel (collapsible, right side) -->
        <div id="artifact-panel" x-data="artifactPanel" :class="{ open: open }">

            <!-- Toggle tab — always visible at 28px -->
            <div class="artifact-tab" @click="toggle()" :title="open ? 'Collapse artifact panel' : 'Expand artifact panel'">
                <span class="artifact-tab-icon" x-text="open ? 'chevron_right' : 'chevron_left'"></span>
                <span class="artifact-tab-label">Artifacts</span>
                <span class="artifact-dot" :class="{ visible: hasContent }"></span>
            </div>

            <!-- Panel content — hidden when collapsed -->
            <div class="artifact-content" x-show="open" x-cloak>

                <!-- Multi-artifact tab bar — only visible when 2+ tabs exist -->
                <div class="artifact-tabs-bar" x-show="tabs.length > 1">
                    <template x-for="(tab, i) in tabs" :key="tab.id">
                        <div class="artifact-tab-item"
                             :class="{ active: activeTab === i }"
                             @click="switchTab(i)">
                            <span class="artifact-tab-type-icon"
                                  x-text="tab.type === 'svg' ? 'polyline' : (tab.type === 'js' ? 'code' : 'web')"></span>
                            <span class="artifact-tab-title" x-text="tab.title"></span>
                            <button class="artifact-tab-close"
                                    @click.stop="closeTab(i)"
                                    title="Close tab">close</button>
                        </div>
                    </template>
                </div>

                <!-- Header: title reflects active tab; actions always visible -->
                <div class="artifact-header">
                    <span class="artifact-header-title" x-text="(tabs[activeTab] && tabs[activeTab].title) || title || 'Artifact'"></span>
                    <span class="artifact-header-type"
                          x-show="(tabs[activeTab] ? tabs[activeTab].type : type) && (tabs[activeTab] ? tabs[activeTab].type : type) !== 'html'"
                          x-text="tabs[activeTab] ? tabs[activeTab].type : type"></span>

                    <!-- Zoom / pan controls -->
                    <div class="artifact-header-actions artifact-zoom-controls" x-show="hasContent">
                        <button class="artifact-header-btn" @click="zoomIn()"    title="Zoom in  (Ctrl+scroll)">zoom_in</button>
                        <button class="artifact-header-btn" @click="zoomOut()"   title="Zoom out">zoom_out</button>
                        <button class="artifact-header-btn" @click="zoomReset()" title="Reset zoom &amp; pan">fit_screen</button>
                        <button class="artifact-header-btn" :class="{ 'artifact-btn-active': panMode }"
                                @click="togglePan()" title="Pan mode (drag to pan)">pan_tool</button>
                    </div>

                    <!-- Service quick-links -->
                    <div class="artifact-header-actions artifact-service-links">
                        <template x-for="link in serviceLinks" :key="link.url">
                            <button class="artifact-header-btn"
                                    @click="window.open(link.url, '_blank')"
                                    :title="'Open ' + link.label">
                                <span x-text="link.icon"></span>
                            </button>
                        </template>
                    </div>

                    <!-- Primary actions -->
                    <div class="artifact-header-actions">
                        <button class="artifact-header-btn" x-show="closedTabs.length > 0"
                                @click="reopenLastTab()"
                                :title="'Reopen: ' + (closedTabs[0] ? closedTabs[0].title : '')">undo</button>
                        <button class="artifact-header-btn" @click="openInNewTab()" title="Open in new tab">open_in_new</button>
                        <button class="artifact-header-btn" @click="closeActiveTab()" title="Close tab">close</button>
                    </div>
                </div>

                <!-- Frame wrapper: skeleton sits behind iframe, fades out on load -->
                <div class="artifact-frame-wrapper">
                    <div id="artifact-skeleton">
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line"></div>
                        <div class="skeleton-line"></div>
                        <div class="skeleton-block"></div>
                    </div>
                    <iframe id="artifact-frame" sandbox="allow-scripts allow-modals allow-popups allow-popups-to-escape-sandbox" title="Artifact"></iframe>
                </div>
            </div>
        </div>

        <!-- Right Panel (Message History and Input Section) -->
        <div id="right-panel" class="panel" >

            <!-- top section with time, status etc. -->
            <x-component path="chat/top-section/chat-top.html"></x-component>

            <!-- Welcome Screen Component -->
            <div x-data x-show="$store.welcomeStore && $store.welcomeStore.isVisible">
                <x-component path="welcome/welcome-screen.html"></x-component>
            </div>
            <!-- Message History (actual messages) -->
            <div id="chat-history" x-data x-show="!$store.welcomeStore || !$store.welcomeStore.isVisible"></div>

            <!-- NEW: Toast Stack Component -->
            <div style="position: relative; height: 0;">
                <x-component path="notifications/notification-toast-stack.html"></x-component>
            </div>

            <div id="toast" class="toast">
                <div class="toast__content">
                    <div class="toast__title"></div>
                    <div class="toast__separator"></div>
                    <div class="toast__message"></div>
                </div>
                <button class="toast__copy" style="display: none;">Copy</button>
                <button class="toast__close">Close</button>
            </div>
            <!-- Chat Input Area -->
            <div x-show="!$store.welcomeStore || !$store.welcomeStore.isVisible">
                <!-- Progress Bar -->
                <x-component path="chat/input/progress.html"></x-component>
                <!-- Input Section -->
                <x-component path="chat/input/chat-bar.html"></x-component>
            </div>
        </div>
                        </div>

    <!-- Drag and Drop Overlay Component -->
    <x-component path="chat/attachments/dragDropOverlay.html"></x-component>

    <!-- Register Service Worker for offline support and caching -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('js/sw.js').then(registration => {
                    console.log('SW registered: ', registration);
                }).catch(registrationError => {
                    console.log('SW registration failed: ', registrationError);
                });
            });
        }
    </script>

</body>

</html>

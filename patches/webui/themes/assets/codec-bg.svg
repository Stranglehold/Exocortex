<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Codec background: worn field surface — sepia/organic texture -->
  <rect width="800" height="600" fill="#0e0c08"/>

  <!-- Diagonal texture lines — very faint, suggesting aged paper grain -->
  <line x1="0"   y1="0"   x2="600" y2="600" stroke="#2a1808" stroke-width="0.8" opacity="0.06"/>
  <line x1="100" y1="0"   x2="700" y2="600" stroke="#2a1808" stroke-width="0.8" opacity="0.06"/>
  <line x1="200" y1="0"   x2="800" y2="600" stroke="#2a1808" stroke-width="0.8" opacity="0.06"/>
  <line x1="300" y1="0"   x2="800" y2="500" stroke="#2a1808" stroke-width="0.6" opacity="0.05"/>
  <line x1="0"   y1="100" x2="500" y2="600" stroke="#2a1808" stroke-width="0.6" opacity="0.05"/>
  <line x1="0"   y1="200" x2="400" y2="600" stroke="#2a1808" stroke-width="0.6" opacity="0.05"/>
  <line x1="400" y1="0"   x2="800" y2="400" stroke="#241405" stroke-width="0.5" opacity="0.04"/>
  <line x1="500" y1="0"   x2="800" y2="300" stroke="#241405" stroke-width="0.5" opacity="0.04"/>
  <line x1="600" y1="0"   x2="800" y2="200" stroke="#241405" stroke-width="0.5" opacity="0.04"/>
  <line x1="0"   y1="300" x2="300" y2="600" stroke="#241405" stroke-width="0.5" opacity="0.04"/>
  <line x1="0"   y1="400" x2="200" y2="600" stroke="#241405" stroke-width="0.5" opacity="0.04"/>

  <!-- Organic foliage shadow shapes — overlapping ellipses, irregular placement -->
  <!-- Upper-left canopy cluster -->
  <ellipse cx="80"  cy="90"  rx="120" ry="70"  fill="#3a2a10" opacity="0.18"/>
  <ellipse cx="140" cy="60"  rx="90"  ry="55"  fill="#2e2010" opacity="0.15"/>
  <ellipse cx="50"  cy="140" rx="80"  ry="50"  fill="#321c08" opacity="0.12"/>
  <ellipse cx="200" cy="110" rx="70"  ry="45"  fill="#3a2a10" opacity="0.10"/>

  <!-- Right edge foliage -->
  <ellipse cx="720" cy="80"  rx="110" ry="65"  fill="#3a2a10" opacity="0.16"/>
  <ellipse cx="780" cy="140" rx="80"  ry="60"  fill="#2e1c08" opacity="0.13"/>
  <ellipse cx="660" cy="130" rx="75"  ry="50"  fill="#342210" opacity="0.11"/>
  <ellipse cx="750" cy="200" rx="90"  ry="55"  fill="#2a1a08" opacity="0.10"/>

  <!-- Mid-frame scattered patches -->
  <ellipse cx="300" cy="200" rx="90"  ry="55"  fill="#2e2010" opacity="0.13"/>
  <ellipse cx="450" cy="170" rx="70"  ry="45"  fill="#3a2a10" opacity="0.10"/>
  <ellipse cx="550" cy="220" rx="85"  ry="50"  fill="#2a1a08" opacity="0.12"/>
  <ellipse cx="180" cy="280" rx="100" ry="60"  fill="#301e0a" opacity="0.11"/>
  <ellipse cx="620" cy="300" rx="90"  ry="55"  fill="#2e1c08" opacity="0.13"/>

  <!-- Ground-level patches — lower half -->
  <ellipse cx="100" cy="420" rx="130" ry="75"  fill="#3a2a10" opacity="0.20"/>
  <ellipse cx="60"  cy="500" rx="100" ry="60"  fill="#2e2010" opacity="0.16"/>
  <ellipse cx="200" cy="480" rx="110" ry="65"  fill="#321c08" opacity="0.14"/>
  <ellipse cx="350" cy="460" rx="90"  ry="55"  fill="#2a1a08" opacity="0.12"/>
  <ellipse cx="500" cy="500" rx="120" ry="70"  fill="#301e0a" opacity="0.18"/>
  <ellipse cx="650" cy="440" rx="100" ry="60"  fill="#3a2a10" opacity="0.16"/>
  <ellipse cx="750" cy="520" rx="90"  ry="55"  fill="#2e1c08" opacity="0.13"/>
  <ellipse cx="420" cy="550" rx="130" ry="65"  fill="#2a1808" opacity="0.20"/>
  <ellipse cx="160" cy="560" rx="100" ry="50"  fill="#342210" opacity="0.14"/>

  <!-- Deep shadow pools — very low opacity, large organic forms -->
  <ellipse cx="400" cy="320" rx="220" ry="130" fill="#1a0e04" opacity="0.22"/>
  <ellipse cx="150" cy="350" rx="180" ry="110" fill="#160c04" opacity="0.18"/>
  <ellipse cx="650" cy="400" rx="190" ry="120" fill="#1a0e04" opacity="0.20"/>
</svg>

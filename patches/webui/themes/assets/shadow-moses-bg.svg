<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <g fill="none" stroke="#6ab4d4">
    <!-- Facility floor plan schematic — Shadow Moses nuclear storage complex -->
    <!-- Main outer perimeter -->
    <rect x="80" y="60" width="1040" height="680" stroke-width="0.8" opacity="0.20" rx="2"/>
    <!-- Primary containment wing A — left block -->
    <rect x="80"  y="60"  width="340" height="220" stroke-width="0.6" opacity="0.18"/>
    <rect x="100" y="80"  width="300" height="180" stroke-width="0.4" opacity="0.14"/>
    <!-- Cells within wing A -->
    <line x1="200" y1="80"  x2="200" y2="260" stroke-width="0.4" opacity="0.12"/>
    <line x1="300" y1="80"  x2="300" y2="260" stroke-width="0.4" opacity="0.12"/>
    <line x1="100" y1="160" x2="400" y2="160" stroke-width="0.4" opacity="0.12"/>
    <!-- Warhead storage: central large chamber -->
    <rect x="420" y="140" width="360" height="340" stroke-width="0.9" opacity="0.22" rx="2"/>
    <rect x="440" y="160" width="320" height="300" stroke-width="0.5" opacity="0.16" rx="1"/>
    <!-- Storage bays inside -->
    <line x1="520" y1="160" x2="520" y2="460" stroke-width="0.4" opacity="0.12"/>
    <line x1="600" y1="160" x2="600" y2="460" stroke-width="0.4" opacity="0.12"/>
    <line x1="680" y1="160" x2="680" y2="460" stroke-width="0.4" opacity="0.12"/>
    <line x1="440" y1="260" x2="760" y2="260" stroke-width="0.4" opacity="0.12"/>
    <line x1="440" y1="360" x2="760" y2="360" stroke-width="0.4" opacity="0.12"/>
    <!-- Primary wing B — right block -->
    <rect x="780" y="60" width="340" height="220" stroke-width="0.6" opacity="0.18"/>
    <rect x="800" y="80" width="300" height="180" stroke-width="0.4" opacity="0.14"/>
    <line x1="900" y1="80"  x2="900" y2="260" stroke-width="0.4" opacity="0.12"/>
    <line x1="1000" y1="80" x2="1000" y2="260" stroke-width="0.4" opacity="0.12"/>
    <line x1="800" y1="170" x2="1100" y2="170" stroke-width="0.4" opacity="0.12"/>
    <!-- Lower maintenance corridors -->
    <rect x="80"  y="520" width="1040" height="220" stroke-width="0.6" opacity="0.16"/>
    <line x1="80"  y1="570" x2="1120" y2="570" stroke-width="0.4" opacity="0.10"/>
    <line x1="80"  y1="620" x2="1120" y2="620" stroke-width="0.4" opacity="0.10"/>
    <line x1="80"  y1="680" x2="1120" y2="680" stroke-width="0.4" opacity="0.10"/>
    <!-- Vertical corridor dividers — lower -->
    <line x1="240"  y1="520" x2="240"  y2="740" stroke-width="0.4" opacity="0.10"/>
    <line x1="400"  y1="520" x2="400"  y2="740" stroke-width="0.4" opacity="0.10"/>
    <line x1="600"  y1="520" x2="600"  y2="740" stroke-width="0.4" opacity="0.10"/>
    <line x1="800"  y1="520" x2="800"  y2="740" stroke-width="0.4" opacity="0.10"/>
    <line x1="960"  y1="520" x2="960"  y2="740" stroke-width="0.4" opacity="0.10"/>
    <!-- Connector corridors between wings and central chamber -->
    <rect x="80"  y="280" width="340" height="240" stroke-width="0.5" opacity="0.14"/>
    <rect x="780" y="280" width="340" height="240" stroke-width="0.5" opacity="0.14"/>
    <line x1="80"  y1="350" x2="420"  y2="350" stroke-width="0.4" opacity="0.10"/>
    <line x1="780" y1="350" x2="1120" y2="350" stroke-width="0.4" opacity="0.10"/>
    <line x1="80"  y1="430" x2="420"  y2="430" stroke-width="0.4" opacity="0.10"/>
    <line x1="780" y1="430" x2="1120" y2="430" stroke-width="0.4" opacity="0.10"/>
    <line x1="200" y1="280" x2="200"  y2="520" stroke-width="0.4" opacity="0.10"/>
    <line x1="300" y1="280" x2="300"  y2="520" stroke-width="0.4" opacity="0.10"/>
    <line x1="900" y1="280" x2="900"  y2="520" stroke-width="0.4" opacity="0.10"/>
    <line x1="1000" y1="280" x2="1000" y2="520" stroke-width="0.4" opacity="0.10"/>
    <!-- Door indicators: small gaps with perpendicular marks -->
    <g stroke-width="0.6" opacity="0.18">
      <line x1="396" y1="300" x2="424" y2="300"/>
      <line x1="396" y1="296" x2="396" y2="304"/>
      <line x1="424" y1="296" x2="424" y2="304"/>
      <line x1="776" y1="300" x2="804" y2="300"/>
      <line x1="776" y1="296" x2="776" y2="304"/>
      <line x1="804" y1="296" x2="804" y2="304"/>
      <line x1="396" y1="430" x2="424" y2="430"/>
      <line x1="396" y1="426" x2="396" y2="434"/>
      <line x1="424" y1="426" x2="424" y2="434"/>
      <line x1="776" y1="430" x2="804" y2="430"/>
      <line x1="776" y1="426" x2="776" y2="434"/>
      <line x1="804" y1="426" x2="804" y2="434"/>
    </g>
    <!-- Emergency exit markers: small X marks at corners -->
    <g stroke-width="0.5" opacity="0.15">
      <line x1="88"  y1="68"  x2="96"  y2="76"/>
      <line x1="96"  y1="68"  x2="88"  y2="76"/>
      <line x1="1104" y1="68"  x2="1112" y2="76"/>
      <line x1="1112" y1="68"  x2="1104" y2="76"/>
      <line x1="88"  y1="732" x2="96"  y2="740"/>
      <line x1="96"  y1="732" x2="88"  y2="740"/>
      <line x1="1104" y1="732" x2="1112" y2="740"/>
      <line x1="1112" y1="732" x2="1104" y2="740"/>
    </g>
    <!-- Room label tags: tiny rectangles suggesting text blocks -->
    <g opacity="0.11">
      <rect x="130" y="150" width="50" height="6" fill="#6ab4d4" stroke="none"/>
      <rect x="130" y="160" width="35" height="4" fill="#6ab4d4" stroke="none"/>
      <rect x="840" y="150" width="50" height="6" fill="#6ab4d4" stroke="none"/>
      <rect x="840" y="160" width="35" height="4" fill="#6ab4d4" stroke="none"/>
      <rect x="510" y="300" width="60" height="6" fill="#6ab4d4" stroke="none"/>
      <rect x="510" y="310" width="40" height="4" fill="#6ab4d4" stroke="none"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">

  <!-- FOX Unit emblem — faithful recreation of MGS FOX unit insignia -->
  <!-- Orange fox silhouette on black oval, gray border, FOX text -->

  <!-- Outer gray ring -->
  <ellipse cx="100" cy="110" rx="93" ry="105" fill="#707070"/>
  <!-- Black oval -->
  <ellipse cx="100" cy="110" rx="87" ry="99" fill="#0a0808"/>

  <!-- Fox silhouette — amber orange, crouching/alert pose facing lower-left -->
  <!-- Main body: fills roughly top 75% of oval -->
  <path d="
    M 32,126
    C 20,116 16,104 22,94
    L 36,80
    C 40,70 46,62 52,50
    L 62,36
    C 68,50 72,58 80,66
    C 90,72 100,68 114,62
    C 128,58 144,68 160,82
    C 170,92 175,108 170,122
    C 165,132 155,132 150,122
    C 146,114 148,106 145,100
    L 136,118
    C 128,138 116,146 100,148
    C 86,148 74,152 62,160
    C 52,166 42,168 38,160
    C 34,152 36,142 40,136
    L 40,128
    C 38,128 34,128 32,126 Z
  " fill="#e8860c"/>

  <!-- Ear detail — lighter inner ear -->
  <path d="
    M 52,50 L 58,40 L 62,36 L 60,52 Z
  " fill="#c86808" opacity="0.6"/>

  <!-- Eye area — dark recess -->
  <ellipse cx="42" cy="104" rx="6" ry="5" fill="#1a0804" opacity="0.7"/>
  <ellipse cx="44" cy="104" rx="3" ry="3" fill="#0a0404" opacity="0.9"/>

  <!-- Snout / nose tip -->
  <path d="M 22,94 L 18,100 L 24,104 L 32,100 Z" fill="#c86808"/>

  <!-- Whisker lines -->
  <line x1="24" y1="100" x2="8" y2="96" stroke="#c86808" stroke-width="1.2" opacity="0.7"/>
  <line x1="24" y1="102" x2="8" y2="104" stroke="#c86808" stroke-width="1.2" opacity="0.7"/>
  <line x1="24" y1="104" x2="8" y2="110" stroke="#c86808" stroke-width="1" opacity="0.5"/>

  <!-- Body lightning-bolt / chest marking — distinctive FOX unit detail -->
  <path d="
    M 90,120 L 82,138 L 94,135 L 88,155 L 102,140 L 90,143 Z
  " fill="#c86808" opacity="0.75"/>

  <!-- Tail highlight — brighter tip -->
  <path d="
    M 168,110 C 172,100 174,92 170,86 C 165,80 158,82 160,90 C 162,98 168,106 168,110 Z
  " fill="#f0a030" opacity="0.6"/>

  <!-- Paw / front leg detail -->
  <path d="M 38,158 L 34,168 L 42,170 L 46,160 Z" fill="#c86808" opacity="0.8"/>
  <path d="M 52,162 L 48,172 L 56,172 L 58,162 Z" fill="#c86808" opacity="0.7"/>

  <!-- Divider line above text -->
  <line x1="28" y1="200" x2="172" y2="200" stroke="#606060" stroke-width="0.8" opacity="0.8"/>

  <!-- FOX text -->
  <text x="100" y="220"
        font-family="'Arial Black', 'Arial', sans-serif"
        font-size="24" font-weight="900"
        fill="#e8e0d0" text-anchor="middle"
        letter-spacing="6">FOX</text>

</svg>

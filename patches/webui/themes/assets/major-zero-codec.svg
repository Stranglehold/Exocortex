<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 252">
  <!-- Background fill -->
  <rect width="200" height="252" fill="#120e08"/>

  <!-- Outer frame -->
  <rect x="3" y="3" width="194" height="246" fill="none" stroke="#7a5820" stroke-width="1"/>

  <!-- Corner accent marks — codec targeting reticle style -->
  <!-- top-left -->
  <polyline points="3,28 3,3 28,3" fill="none" stroke="#c97d2e" stroke-width="2"/>
  <!-- top-right -->
  <polyline points="172,3 197,3 197,28" fill="none" stroke="#c97d2e" stroke-width="2"/>
  <!-- bottom-left -->
  <polyline points="3,224 3,249 28,249" fill="none" stroke="#c97d2e" stroke-width="2"/>
  <!-- bottom-right -->
  <polyline points="172,249 197,249 197,224" fill="none" stroke="#c97d2e" stroke-width="2"/>

  <!-- Portrait inner frame -->
  <rect x="12" y="12" width="176" height="210" fill="#1c1408" stroke="#4a3410" stroke-width="0.5"/>

  <!-- Scan lines — every 8px -->
  <g stroke="#080604" stroke-width="0.8" opacity="0.45">
    <line x1="12" y1="20" x2="188" y2="20"/>
    <line x1="12" y1="28" x2="188" y2="28"/>
    <line x1="12" y1="36" x2="188" y2="36"/>
    <line x1="12" y1="44" x2="188" y2="44"/>
    <line x1="12" y1="52" x2="188" y2="52"/>
    <line x1="12" y1="60" x2="188" y2="60"/>
    <line x1="12" y1="68" x2="188" y2="68"/>
    <line x1="12" y1="76" x2="188" y2="76"/>
    <line x1="12" y1="84" x2="188" y2="84"/>
    <line x1="12" y1="92" x2="188" y2="92"/>
    <line x1="12" y1="100" x2="188" y2="100"/>
    <line x1="12" y1="108" x2="188" y2="108"/>
    <line x1="12" y1="116" x2="188" y2="116"/>
    <line x1="12" y1="124" x2="188" y2="124"/>
    <line x1="12" y1="132" x2="188" y2="132"/>
    <line x1="12" y1="140" x2="188" y2="140"/>
    <line x1="12" y1="148" x2="188" y2="148"/>
    <line x1="12" y1="156" x2="188" y2="156"/>
    <line x1="12" y1="164" x2="188" y2="164"/>
    <line x1="12" y1="172" x2="188" y2="172"/>
    <line x1="12" y1="180" x2="188" y2="180"/>
    <line x1="12" y1="188" x2="188" y2="188"/>
    <line x1="12" y1="196" x2="188" y2="196"/>
    <line x1="12" y1="204" x2="188" y2="204"/>
    <line x1="12" y1="212" x2="188" y2="212"/>
  </g>

  <!-- Head silhouette — older gentleman, slightly wide face -->
  <ellipse cx="100" cy="106" rx="46" ry="52" fill="#281808" stroke="#6a4018" stroke-width="0.8"/>

  <!-- Military beret — flat top, slight rear drape -->
  <ellipse cx="100" cy="66" rx="48" ry="11" fill="#221408" stroke="#5a3810" stroke-width="0.7"/>
  <rect x="52" y="58" width="96" height="12" fill="#221408" stroke="none" rx="1"/>
  <ellipse cx="100" cy="58" rx="42" ry="8" fill="#281808" stroke="#5a3810" stroke-width="0.5"/>
  <!-- Beret badge suggestion -->
  <circle cx="86" cy="59" r="4" fill="none" stroke="#8a5820" stroke-width="0.7"/>
  <circle cx="86" cy="59" r="1.5" fill="#7a4818"/>

  <!-- Glasses — the defining feature of Major Zero -->
  <ellipse cx="82" cy="110" rx="16" ry="12" fill="#1c1008" fill-opacity="0.5" stroke="#c97d2e" stroke-width="1.3"/>
  <ellipse cx="118" cy="110" rx="16" ry="12" fill="#1c1008" fill-opacity="0.5" stroke="#c97d2e" stroke-width="1.3"/>
  <!-- Bridge -->
  <line x1="98" y1="110" x2="102" y2="110" stroke="#c97d2e" stroke-width="1.1"/>
  <!-- Temples -->
  <line x1="66" y1="110" x2="54" y2="110" stroke="#8a5820" stroke-width="0.9"/>
  <line x1="134" y1="110" x2="146" y2="110" stroke="#8a5820" stroke-width="0.9"/>

  <!-- Nose -->
  <path d="M98,122 L96,130 Q100,133 104,130 L102,122" fill="none" stroke="#5a3810" stroke-width="0.7"/>

  <!-- Mouth — serious, slightly pursed -->
  <path d="M86,140 Q100,137 114,140" fill="none" stroke="#5a3810" stroke-width="0.8"/>

  <!-- Ear suggestion -->
  <path d="M54,100 Q46,106 46,114 Q46,120 54,122" fill="none" stroke="#5a3010" stroke-width="0.7"/>
  <path d="M146,100 Q154,106 154,114 Q154,120 146,122" fill="none" stroke="#5a3010" stroke-width="0.7"/>

  <!-- Neck -->
  <rect x="88" y="157" width="24" height="20" fill="#281808" stroke="none"/>

  <!-- Shoulders / military jacket -->
  <path d="M20,222 Q22,178 52,167 Q70,160 88,157 L112,157 Q130,160 148,167 Q178,178 180,222 Z"
        fill="#221408" stroke="#5a3810" stroke-width="0.8"/>

  <!-- Collar V -->
  <path d="M88,157 L100,176 L112,157" fill="none" stroke="#7a5020" stroke-width="1"/>

  <!-- Left epaulette -->
  <rect x="20" y="167" width="32" height="11" fill="#281808" stroke="#6a4818" stroke-width="0.7" rx="2"/>
  <!-- Right epaulette -->
  <rect x="148" y="167" width="32" height="11" fill="#281808" stroke="#6a4818" stroke-width="0.7" rx="2"/>

  <!-- Stars -->
  <text x="36" y="177" font-family="serif" font-size="8" fill="#c97d2e" text-anchor="middle">★★</text>
  <text x="164" y="177" font-family="serif" font-size="8" fill="#c97d2e" text-anchor="middle">★★</text>

  <!-- Divider -->
  <line x1="12" y1="224" x2="188" y2="224" stroke="#4a3410" stroke-width="0.5"/>

  <!-- Nameplate -->
  <rect x="12" y="224" width="176" height="28" fill="#160e04"/>
  <text x="100" y="236" font-family="'Courier New', monospace" font-size="10"
        fill="#c97d2e" text-anchor="middle" font-weight="bold" letter-spacing="1">MAJOR ZERO</text>
  <text x="100" y="247" font-family="'Courier New', monospace" font-size="7"
        fill="#7a5820" text-anchor="middle" letter-spacing="0.5">FREQ: 140.96  ▓▓▓▓▓▓</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <g fill="none" stroke="#c9922e">
    <!-- Mission planning grid: fine coordinate mesh -->
    <g stroke-width="0.4" opacity="0.12">
      <!-- Vertical grid lines every 60px -->
      <line x1="60"   y1="0" x2="60"   y2="800"/>
      <line x1="120"  y1="0" x2="120"  y2="800"/>
      <line x1="180"  y1="0" x2="180"  y2="800"/>
      <line x1="240"  y1="0" x2="240"  y2="800"/>
      <line x1="300"  y1="0" x2="300"  y2="800"/>
      <line x1="360"  y1="0" x2="360"  y2="800"/>
      <line x1="420"  y1="0" x2="420"  y2="800"/>
      <line x1="480"  y1="0" x2="480"  y2="800"/>
      <line x1="540"  y1="0" x2="540"  y2="800"/>
      <line x1="600"  y1="0" x2="600"  y2="800"/>
      <line x1="660"  y1="0" x2="660"  y2="800"/>
      <line x1="720"  y1="0" x2="720"  y2="800"/>
      <line x1="780"  y1="0" x2="780"  y2="800"/>
      <line x1="840"  y1="0" x2="840"  y2="800"/>
      <line x1="900"  y1="0" x2="900"  y2="800"/>
      <line x1="960"  y1="0" x2="960"  y2="800"/>
      <line x1="1020" y1="0" x2="1020" y2="800"/>
      <line x1="1080" y1="0" x2="1080" y2="800"/>
      <line x1="1140" y1="0" x2="1140" y2="800"/>
      <!-- Horizontal grid lines every 60px -->
      <line x1="0" y1="60"  x2="1200" y2="60"/>
      <line x1="0" y1="120" x2="1200" y2="120"/>
      <line x1="0" y1="180" x2="1200" y2="180"/>
      <line x1="0" y1="240" x2="1200" y2="240"/>
      <line x1="0" y1="300" x2="1200" y2="300"/>
      <line x1="0" y1="360" x2="1200" y2="360"/>
      <line x1="0" y1="420" x2="1200" y2="420"/>
      <line x1="0" y1="480" x2="1200" y2="480"/>
      <line x1="0" y1="540" x2="1200" y2="540"/>
      <line x1="0" y1="600" x2="1200" y2="600"/>
      <line x1="0" y1="660" x2="1200" y2="660"/>
      <line x1="0" y1="720" x2="1200" y2="720"/>
      <line x1="0" y1="780" x2="1200" y2="780"/>
    </g>
    <!-- Major grid accent lines every 300px -->
    <g stroke-width="0.7" opacity="0.16">
      <line x1="300"  y1="0" x2="300"  y2="800"/>
      <line x1="600"  y1="0" x2="600"  y2="800"/>
      <line x1="900"  y1="0" x2="900"  y2="800"/>
      <line x1="0"    y1="200" x2="1200" y2="200"/>
      <line x1="0"    y1="400" x2="1200" y2="400"/>
      <line x1="0"    y1="600" x2="1200" y2="600"/>
    </g>
    <!-- Central large diamond — Mother Base emblem shape -->
    <polygon
      points="600,120 870,400 600,680 330,400"
      stroke-width="1.2" opacity="0.22"/>
    <!-- Inner diamond ring -->
    <polygon
      points="600,200 800,400 600,600 400,400"
      stroke-width="0.8" opacity="0.16"/>
    <!-- Innermost diamond -->
    <polygon
      points="600,280 730,400 600,520 470,400"
      stroke-width="0.6" opacity="0.12"/>
    <!-- Diamond crosshairs -->
    <line x1="600" y1="120" x2="600" y2="680" stroke-width="0.5" opacity="0.14"/>
    <line x1="330" y1="400" x2="870" y2="400" stroke-width="0.5" opacity="0.14"/>
    <!-- Corner markers: small cross targets at quadrant intersections -->
    <g stroke-width="0.6" opacity="0.18">
      <!-- top-left quadrant -->
      <line x1="294" y1="300" x2="306" y2="300"/>
      <line x1="300" y1="294" x2="300" y2="306"/>
      <circle cx="300" cy="300" r="4"/>
      <!-- top-right quadrant -->
      <line x1="894" y1="300" x2="906" y2="300"/>
      <line x1="900" y1="294" x2="900" y2="306"/>
      <circle cx="900" cy="300" r="4"/>
      <!-- bottom-left quadrant -->
      <line x1="294" y1="500" x2="306" y2="500"/>
      <line x1="300" y1="494" x2="300" y2="506"/>
      <circle cx="300" cy="500" r="4"/>
      <!-- bottom-right quadrant -->
      <line x1="894" y1="500" x2="906" y2="500"/>
      <line x1="900" y1="494" x2="900" y2="506"/>
      <circle cx="900" cy="500" r="4"/>
    </g>
    <!-- Coordinate text along edges (very faint) -->
    <g font-family="'Courier New', monospace" font-size="8" fill="#c9922e" opacity="0.14" stroke="none">
      <text x="56"   y="16">84°N</text>
      <text x="296"  y="16">84°N</text>
      <text x="596"  y="16">84°N</text>
      <text x="896"  y="16">84°N</text>
      <text x="1096" y="16">84°N</text>
      <text x="8"    y="62">141°W</text>
      <text x="8"    y="302">141°W</text>
      <text x="8"    y="542">141°W</text>
    </g>
  </g>
</svg>

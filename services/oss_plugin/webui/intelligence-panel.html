<!-- intelligence-panel.html — Agent Zero right-canvas Intelligence Surface
     Deploy to: /a0/usr/plugins/exocortex/extensions/webui/right-canvas-panels/
     Requires:  intelligence-store.js registered as Alpine.store("intelligence")
-->

<style>
/* ── Design System Tokens ─────────────────────────────────────── */
.ip {
  --void:    #060810;
  --base:    #0a0f1a;
  --raised:  #0f1629;
  --overlay: #151d35;
  --border:  rgba(255,255,255,.07);
  --border-bright: rgba(0,229,255,.25);

  --cyan:    #00e5ff;
  --cyan-dim: rgba(0,229,255,.15);
  --cyan-glow: 0 0 12px rgba(0,229,255,.35);

  --ok:      #00e676;
  --ok-dim:  rgba(0,230,118,.12);
  --warn:    #ffb300;
  --warn-dim: rgba(255,179,0,.12);
  --danger:  #ff1744;
  --danger-dim: rgba(255,23,68,.12);
  --info:    #448aff;

  --txt-1:   #f0f2f5;
  --txt-2:   #b0b8c8;
  --txt-3:   #6b7a8d;
  --txt-dim: #3d4a5c;

  --font-body: "Inter", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "IBM Plex Mono", "Consolas", monospace;

  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --t-fast:   0.15s;
  --t-normal: 0.25s;

  --r-sm:   6px;
  --r-md:   10px;
  --r-pill: 999px;
}

/* ── Layout ───────────────────────────────────────────────────── */
.ip {
  display: flex;
  flex-direction: column;
  height: 100%;
  background: var(--base);
  color: var(--txt-1);
  font-family: var(--font-body);
  font-size: 13px;
  overflow: hidden;
}

/* ── Header ───────────────────────────────────────────────────── */
.ip-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: var(--void);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.ip-title {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--cyan);
}

.ip-header-spacer { flex: 1; }

.ip-ingest-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 8px;
  border-radius: var(--r-pill);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  border: 1px solid transparent;
  transition: color var(--t-fast), border-color var(--t-fast);
}
.ip-ingest-pill.running { color: var(--ok); border-color: var(--ok); }
.ip-ingest-pill.paused  { color: var(--warn); border-color: var(--warn); }
.ip-ingest-pill.unknown { color: var(--txt-3); border-color: var(--border); }

.ip-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.ip-ingest-pill.running .ip-dot { animation: ip-blink 1.4s ease-in-out infinite; }
@keyframes ip-blink { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ── Tab Bar ──────────────────────────────────────────────────── */
.ip-tabs {
  display: flex;
  background: var(--void);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.ip-tabs::-webkit-scrollbar { display: none; }

.ip-tab {
  flex: 1;
  padding: 8px 4px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--txt-3);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: color var(--t-fast), border-color var(--t-fast);
  white-space: nowrap;
}
.ip-tab:hover { color: var(--txt-2); }
.ip-tab.active { color: var(--cyan); border-bottom-color: var(--cyan); }

/* ── Content ──────────────────────────────────────────────────── */
.ip-content {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  scrollbar-width: thin;
  scrollbar-color: var(--overlay) transparent;
}
.ip-content::-webkit-scrollbar { width: 4px; }
.ip-content::-webkit-scrollbar-track { background: transparent; }
.ip-content::-webkit-scrollbar-thumb { background: var(--overlay); border-radius: 2px; }

/* ── Shared Components ────────────────────────────────────────── */
.ip-section { margin-bottom: 16px; }

.ip-section-label {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--txt-3);
  margin-bottom: 8px;
}

.ip-card {
  background: var(--raised);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 10px 12px;
  margin-bottom: 8px;
  transition: border-color var(--t-fast);
}
.ip-card:hover { border-color: rgba(255,255,255,.14); }

.ip-card-ai {
  border-color: rgba(0,229,255,.2);
  box-shadow: 0 0 0 1px rgba(0,229,255,.08) inset;
}

.ip-stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
}

.ip-stat {
  background: var(--raised);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 10px 12px;
  text-align: center;
}
.ip-stat-val {
  font-family: var(--font-mono);
  font-size: 22px;
  font-weight: 700;
  color: var(--txt-1);
  line-height: 1;
}
.ip-stat-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--txt-3);
  margin-top: 4px;
}
.ip-stat-val.cyan   { color: var(--cyan); }
.ip-stat-val.ok     { color: var(--ok); }
.ip-stat-val.warn   { color: var(--warn); }
.ip-stat-val.danger { color: var(--danger); }

.ip-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--overlay);
  color: var(--txt-2);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .06em;
  cursor: pointer;
  transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast);
}
.ip-btn:hover     { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.15); color: var(--txt-1); }
.ip-btn:disabled  { opacity: .4; cursor: not-allowed; }
.ip-btn.cyan      { border-color: var(--cyan); color: var(--cyan); }
.ip-btn.cyan:hover{ background: var(--cyan-dim); }
.ip-btn.ok        { border-color: var(--ok); color: var(--ok); }
.ip-btn.ok:hover  { background: var(--ok-dim); }
.ip-btn.danger    { border-color: var(--danger); color: var(--danger); }
.ip-btn.danger:hover { background: var(--danger-dim); }
.ip-btn.warn      { border-color: var(--warn); color: var(--warn); }
.ip-btn.warn:hover{ background: var(--warn-dim); }

.ip-btn-row {
  display: flex;
  gap: 6px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}

.ip-select {
  background: var(--raised);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  color: var(--txt-1);
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 5px 8px;
  outline: none;
  cursor: pointer;
}
.ip-select:focus { border-color: var(--border-bright); }

.ip-pill {
  display: inline-flex;
  align-items: center;
  padding: 1px 7px;
  border-radius: var(--r-pill);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
}
.ip-pill.staged     { background: rgba(68,138,255,.15); color: var(--info); border: 1px solid rgba(68,138,255,.3); }
.ip-pill.promoted   { background: var(--ok-dim);        color: var(--ok);   border: 1px solid rgba(0,230,118,.3); }
.ip-pill.falsified  { background: var(--danger-dim);    color: var(--danger); border: 1px solid rgba(255,23,68,.3); }
.ip-pill.active     { background: var(--cyan-dim);      color: var(--cyan); border: 1px solid var(--border-bright); }
.ip-pill.suspended  { background: rgba(255,255,255,.05); color: var(--txt-3); border: 1px solid var(--border); }

.ip-claim-text {
  font-size: 12px;
  color: var(--txt-2);
  line-height: 1.45;
  margin: 4px 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.ip-claim-meta {
  display: flex;
  gap: 8px;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--txt-3);
}

.ip-conf-bar-track {
  height: 3px;
  background: var(--overlay);
  border-radius: 2px;
  margin: 6px 0;
  overflow: hidden;
}
.ip-conf-bar-fill {
  height: 100%;
  background: var(--cyan);
  border-radius: 2px;
  transition: width 0.4s var(--ease-out);
}

.ip-empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--txt-3);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: .06em;
}

.ip-error {
  background: var(--danger-dim);
  border: 1px solid rgba(255,23,68,.25);
  border-radius: var(--r-sm);
  padding: 8px 10px;
  color: var(--danger);
  font-family: var(--font-mono);
  font-size: 11px;
  margin-bottom: 10px;
}

.ip-source-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}
.ip-source-name { flex: 1; color: var(--txt-2); }
.ip-source-count {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--txt-3);
  min-width: 28px;
  text-align: right;
}

.ip-divider {
  height: 1px;
  background: var(--border);
  margin: 12px 0;
}

.ip-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Checkbox */
.ip-check {
  accent-color: var(--cyan);
  width: 14px; height: 14px;
  cursor: pointer;
  flex-shrink: 0;
}

.ip-topic-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  background: var(--raised);
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--txt-2);
  margin: 3px;
}
.ip-topic-chip .ip-topic-count {
  font-size: 10px;
  color: var(--txt-3);
}

/* ── Status tab density improvements ────────────────────────────────── */

/* Compact inline stats bar */
.ip-inline-stats {
  display: flex;
  align-items: center;
  background: var(--raised);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 10px 12px;
  margin-bottom: 8px;
}
.ip-istat {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
  gap: 3px;
}
.ip-istat-val {
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 700;
  color: var(--txt-1);
  line-height: 1;
}
.ip-istat-val.ok     { color: var(--ok); }
.ip-istat-val.warn   { color: var(--warn); }
.ip-istat-val.danger { color: var(--danger); }
.ip-istat-lbl {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--txt-3);
}
.ip-istat-sep {
  width: 1px;
  height: 26px;
  background: var(--border);
  flex-shrink: 0;
  margin: 0 4px;
}

/* Ingest controls row */
.ip-ingest-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  padding: 0 2px;
}
.ip-ingest-age {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--txt-3);
}
.ip-btn-sm {
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 3px 10px;
  border-radius: var(--r-sm);
  border: 1px solid var(--border);
  background: transparent;
  cursor: pointer;
  transition: var(--t-fast);
}
.ip-btn-sm.cyan  { color: var(--cyan);  border-color: var(--cyan); }
.ip-btn-sm.cyan:hover  { background: color-mix(in srgb, var(--cyan) 12%, transparent); }
.ip-btn-sm.ok    { color: var(--ok);   border-color: var(--ok); }
.ip-btn-sm.ok:hover    { background: color-mix(in srgb, var(--ok) 12%, transparent); }
.ip-btn-sm.warn  { color: var(--warn); border-color: var(--warn); }
.ip-btn-sm:disabled { opacity: 0.35; cursor: not-allowed; }

/* Section header row with action slot */
.ip-section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.ip-section-header .ip-section-label { margin-bottom: 0; }

/* Inline add-topic form */
.ip-add-row {
  display: flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 8px;
}
.ip-text-input {
  flex: 1;
  background: var(--bg-1);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 4px 7px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--txt-1);
  outline: none;
}
.ip-text-input:focus { border-color: var(--cyan); }
.ip-text-input::placeholder { color: var(--txt-3); }
.ip-icon-btn {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  color: var(--txt-3);
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 12px;
  padding: 0;
  flex-shrink: 0;
  transition: var(--t-fast);
}
.ip-icon-btn:hover { border-color: var(--txt-1); color: var(--txt-1); }
.ip-icon-btn.ok { color: var(--ok); border-color: var(--ok); }
.ip-icon-btn.ok:hover { background: color-mix(in srgb, var(--ok) 12%, transparent); }

/* Topics as a wrapping flex row */
.ip-topic-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

/* Compact source list */
.ip-source-compact { display: flex; flex-direction: column; gap: 2px; }
.ip-source-compact-row {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 3px 2px;
  border-radius: var(--r-sm);
  transition: background var(--t-fast);
}
.ip-source-compact-row:hover { background: var(--raised); }
.ip-src-dot { font-size: 8px; flex-shrink: 0; line-height: 1; }
.ip-src-dot.ok  { color: var(--ok); }
.ip-src-dot.err { color: var(--danger); }
.ip-src-dot.stale { color: var(--warn); }
.ip-source-compact-row .ip-source-name {
  flex: 1;
  font-size: 11px;
  color: var(--txt-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ip-source-compact-row .ip-source-count {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--txt-3);
  flex-shrink: 0;
}

/* Hypothesis confidence widget */
.ip-hyp-conf {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--cyan);
}

/* Predict consensus */
.ip-consensus {
  background: var(--raised);
  border: 1px solid var(--border-bright);
  border-radius: var(--r-md);
  padding: 12px;
  margin-bottom: 12px;
  box-shadow: var(--cyan-glow);
}
.ip-consensus-val {
  font-family: var(--font-mono);
  font-size: 28px;
  font-weight: 700;
  color: var(--cyan);
}
.ip-consensus-label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--txt-3);
}

/* Profile card */
.ip-profile-card {
  background: var(--raised);
  border: 1px solid var(--border);
  border-left: 3px solid var(--cyan);
  border-radius: var(--r-md);
  padding: 10px 12px;
  margin-bottom: 8px;
  animation: ip-slide-in 0.3s var(--ease-out);
}
@keyframes ip-slide-in { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }

.ip-profile-name {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--txt-2);
  letter-spacing: .04em;
}
.ip-profile-conf {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  color: var(--cyan);
  float: right;
}
.ip-profile-brief {
  font-size: 11px;
  color: var(--txt-3);
  margin-top: 5px;
  line-height: 1.4;
}

/* Toast */
.ip-toast {
  position: absolute;
  bottom: 12px;
  left: 12px;
  right: 12px;
  padding: 8px 12px;
  border-radius: var(--r-sm);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 600;
  z-index: 99;
  animation: ip-slide-in .25s var(--ease-out);
}
.ip-toast.ok     { background: var(--ok-dim);     border: 1px solid rgba(0,230,118,.4); color: var(--ok); }
.ip-toast.warn   { background: var(--warn-dim);   border: 1px solid rgba(255,179,0,.4); color: var(--warn); }
.ip-toast.danger { background: var(--danger-dim); border: 1px solid rgba(255,23,68,.4); color: var(--danger); }
.ip-toast.info   { background: rgba(68,138,255,.15); border: 1px solid rgba(68,138,255,.4); color: var(--info); }

/* Spinner */
.ip-spin {
  display: inline-block;
  width: 12px; height: 12px;
  border: 2px solid var(--border);
  border-top-color: var(--cyan);
  border-radius: 50%;
  animation: ip-rotate .7s linear infinite;
}
@keyframes ip-rotate { to { transform: rotate(360deg); } }

/* Analysis blocks */
.ip-analysis-block {
  background: var(--raised);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 10px 12px;
  margin-bottom: 10px;
}
.ip-analysis-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.ip-analysis-title {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--txt-3);
  flex: 1;
}
.ip-analysis-num {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
}
.ip-analysis-num.ok     { color: var(--ok); }
.ip-analysis-num.warn   { color: var(--warn); }
.ip-analysis-num.danger { color: var(--danger); }
.ip-analysis-num.cyan   { color: var(--cyan); }

.ip-flag-item {
  padding: 4px 0;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  color: var(--txt-2);
}
.ip-flag-item:last-child { border-bottom: none; }
.ip-flag-cluster {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--txt-3);
}

/* Status indicator — no transition (truth-bearing) */
.ip-instant { transition: none !important; }
</style>

<!-- ── Panel Root ──────────────────────────────────────────────── -->
<div class="ip" x-data="{}" style="position: relative;">

  <!-- ── Header ─────────────────────────────────────────────────── -->
  <div class="ip-header">
    <span class="ip-title">Intel</span>

    <!-- Ingest status pill — instant state, no transition -->
    <template x-if="$store.intelligence.health">
      <span class="ip-ingest-pill ip-instant"
            :class="$store.intelligence.ingestPaused ? 'paused' : 'running'">
        <span class="ip-dot"></span>
        <span x-text="$store.intelligence.ingestPaused ? 'PAUSED' : 'LIVE'"></span>
      </span>
    </template>

    <span class="ip-header-spacer"></span>

    <!-- Quick ingest controls -->
    <template x-if="$store.intelligence.ingestPaused">
      <button class="ip-btn ok"
              @click="$store.intelligence.resumeIngest()">▶ Resume</button>
    </template>
    <template x-if="!$store.intelligence.ingestPaused">
      <button class="ip-btn warn"
              @click="$store.intelligence.pauseIngest()">⏸ Pause</button>
    </template>
  </div>

  <!-- ── Tab Bar ─────────────────────────────────────────────────── -->
  <div class="ip-tabs">
    <template x-for="tab in ['status','triage','ledger','analysis','hypotheses','predict']" :key="tab">
      <button class="ip-tab"
              :class="$store.intelligence.tab === tab ? 'active' : ''"
              @click="$store.intelligence.setTab(tab)"
              x-text="tab.charAt(0).toUpperCase() + tab.slice(1)">
      </button>
    </template>
  </div>

  <!-- ── Content ─────────────────────────────────────────────────── -->
  <div class="ip-content">

    <!-- Error banner -->
    <div x-show="$store.intelligence.error" class="ip-error" x-text="'⚠ ' + $store.intelligence.error"></div>

    <!-- Loading spinner -->
    <div x-show="$store.intelligence.loading && !$store.intelligence.error"
         style="display:flex;justify-content:center;padding:30px 0;">
      <span class="ip-spin"></span>
    </div>

    <!-- ── STATUS TAB ──────────────────────────────────────────────── -->
    <div x-show="$store.intelligence.tab === 'status'" x-cloak>

      <!-- Inline stats bar -->
      <template x-if="$store.intelligence.health">
        <div>
          <div class="ip-inline-stats">
            <div class="ip-istat">
              <span class="ip-istat-val warn"
                    x-text="($store.intelligence.health.claims?.staged ?? 0).toLocaleString()"></span>
              <span class="ip-istat-lbl">staged</span>
            </div>
            <span class="ip-istat-sep"></span>
            <div class="ip-istat">
              <span class="ip-istat-val ok"
                    x-text="($store.intelligence.health.claims?.promoted ?? 0).toLocaleString()"></span>
              <span class="ip-istat-lbl">promoted</span>
            </div>
            <span class="ip-istat-sep"></span>
            <div class="ip-istat">
              <span class="ip-istat-val"
                    x-text="($store.intelligence.health.sources_count ?? 0)"></span>
              <span class="ip-istat-lbl">sources</span>
            </div>
            <span class="ip-istat-sep"></span>
            <div class="ip-istat">
              <span class="ip-istat-val"
                    :class="($store.intelligence.health.source_health?.failing ?? 0) > 0 ? 'danger' : 'ok'"
                    x-text="($store.intelligence.health.source_health?.failing ?? 0) + ' fail'"></span>
              <span class="ip-istat-lbl">src health</span>
            </div>
          </div>

          <!-- Ingest controls row -->
          <div class="ip-ingest-row">
            <span class="ip-ingest-age"
                  x-text="'last: ' + $store.intelligence.timeSince($store.intelligence.health.last_ingestion)">
            </span>
            <button class="ip-btn-sm"
                    :disabled="$store.intelligence.loading"
                    @click="$store.intelligence.runIngestNow()">⟳ run now</button>
            <template x-if="$store.intelligence.ingestPaused">
              <button class="ip-btn-sm ok" @click="$store.intelligence.resumeIngest()">▶ resume</button>
            </template>
            <template x-if="!$store.intelligence.ingestPaused">
              <button class="ip-btn-sm" @click="$store.intelligence.pauseIngest()">⏸ pause</button>
            </template>
          </div>
        </div>
      </template>

      <!-- Topics -->
      <div class="ip-section">
        <div class="ip-section-header">
          <span>Topics</span>
          <button class="ip-icon-btn"
                  :class="$store.intelligence.addTopicOpen ? 'ok' : ''"
                  @click="$store.intelligence.addTopicOpen = !$store.intelligence.addTopicOpen"
                  title="Add topic">+</button>
        </div>
        <template x-if="$store.intelligence.addTopicOpen">
          <div class="ip-add-row">
            <input class="ip-text-input" type="text" placeholder="slug (e.g. iran-hormuz)"
                   x-model="$store.intelligence.addTopicInput"
                   @keydown.enter="$store.intelligence.addTopic()"
                   @keydown.escape="$store.intelligence.addTopicOpen = false">
            <button class="ip-icon-btn ok"
                    :disabled="!$store.intelligence.addTopicInput.trim()"
                    @click="$store.intelligence.addTopic()">✓</button>
          </div>
        </template>
        <template x-if="$store.intelligence.topics.length === 0">
          <div class="ip-empty">No topics configured</div>
        </template>
        <template x-for="t in $store.intelligence.topics" :key="t.tag ?? t">
          <div class="ip-topic-row">
            <span x-text="t.tag ?? t"></span>
            <span class="ip-topic-count" x-text="t.claim_count != null ? t.claim_count.toLocaleString() : '0'"></span>
          </div>
        </template>
      </div>

      <!-- Source health summary -->
      <template x-if="$store.intelligence.sources.length">
        <div class="ip-section">
          <div class="ip-section-header"><span>Sources</span></div>
          <div class="ip-source-compact">
            <template x-for="s in $store.intelligence.sources.slice(0,10)" :key="s.id ?? s.name">
              <div class="ip-source-compact-row">
                <span class="ip-src-dot"
                      :class="s.last_fetch_error ? 'err' : (s.claim_count === 0 ? 'stale' : 'ok')"></span>
                <span class="ip-source-name" x-text="s.name"></span>
                <span class="ip-source-count" x-text="(s.claim_count ?? 0).toLocaleString()"></span>
              </div>
            </template>
          </div>
        </div>
      </template>

    </div>

    <!-- ── TRIAGE TAB ──────────────────────────────────────────────── -->
    <div x-show="$store.intelligence.tab === 'triage'" x-cloak>

      <!-- Controls -->
      <div class="ip-btn-row">
        <select class="ip-select" x-model="$store.intelligence.triageTopic"
                @change="$store.intelligence.loadStaged()">
          <option value="">— All topics —</option>
          <template x-for="t in $store.intelligence.topics" :key="t.tag ?? t">
            <option :value="t.tag ?? t" x-text="t.tag ?? t"></option>
          </template>
        </select>

        <button class="ip-btn" @click="$store.intelligence.selectAll()">All</button>
        <button class="ip-btn" @click="$store.intelligence.clearSel()">None</button>
      </div>

      <!-- Bulk actions — visible when selection exists -->
      <template x-if="$store.intelligence.triageSel.length > 0">
        <div class="ip-btn-row">
          <button class="ip-btn ok" @click="$store.intelligence.bulkPromote()">
            ✓ Promote (<span x-text="$store.intelligence.triageSel.length"></span>)
          </button>
        </div>
      </template>

      <!-- Count -->
      <div style="font-family:var(--font-mono);font-size:10px;color:var(--txt-3);margin-bottom:10px;"
           x-text="$store.intelligence.stagedTotal.toLocaleString() + ' staged'">
      </div>

      <!-- Claim list -->
      <template x-if="$store.intelligence.staged.length === 0 && !$store.intelligence.loading">
        <div class="ip-empty">No staged claims</div>
      </template>

      <template x-for="c in $store.intelligence.staged" :key="c.id">
        <div class="ip-card" style="display:flex;gap:8px;align-items:flex-start;">
          <input type="checkbox" class="ip-check"
                 :checked="$store.intelligence.isSel(c.id)"
                 @change="$store.intelligence.toggleSel(c.id)">
          <div style="flex:1;min-width:0;">
            <div class="ip-claim-meta">
              <span x-text="c.source_name ?? '—'"></span>
              <span x-text="$store.intelligence.fmtDate(c.published_at ?? c.extracted_at)"></span>
              <span class="ip-pill staged" x-text="$store.intelligence.techniqueLabel(c.technique_class)"></span>
            </div>
            <div class="ip-claim-text" x-text="c.claim_text"></div>
          </div>
        </div>
      </template>

    </div>

    <!-- ── LEDGER TAB ──────────────────────────────────────────────── -->
    <div x-show="$store.intelligence.tab === 'ledger'" x-cloak>

      <div class="ip-btn-row" style="margin-bottom:12px;">
        <select class="ip-select" x-model="$store.intelligence.ledgerTopic"
                @change="$store.intelligence.loadLedger()">
          <option value="">— All topics —</option>
          <template x-for="t in $store.intelligence.topics" :key="t.tag ?? t">
            <option :value="t.tag ?? t" x-text="t.tag ?? t"></option>
          </template>
        </select>
      </div>

      <div style="font-family:var(--font-mono);font-size:10px;color:var(--txt-3);margin-bottom:10px;"
           x-text="$store.intelligence.ledgerTotal.toLocaleString() + ' promoted'">
      </div>

      <template x-if="$store.intelligence.ledger.length === 0 && !$store.intelligence.loading">
        <div class="ip-empty">No promoted claims</div>
      </template>

      <template x-for="c in $store.intelligence.ledger" :key="c.id">
        <div class="ip-card">
          <div class="ip-claim-meta">
            <span x-text="c.source_name ?? '—'"></span>
            <span x-text="$store.intelligence.fmtDate(c.published_at ?? c.extracted_at)"></span>
            <span class="ip-pill promoted">✓</span>
            <span class="ip-pill"
                  style="background:rgba(255,255,255,.06);color:var(--txt-3);border:1px solid var(--border);"
                  x-text="$store.intelligence.techniqueLabel(c.technique_class)"></span>
          </div>
          <div class="ip-claim-text" x-text="c.claim_text"></div>
          <a :href="c.article_url" target="_blank"
             style="font-family:var(--font-mono);font-size:10px;color:var(--cyan);text-decoration:none;"
             x-show="c.article_url">↗ source</a>
        </div>
      </template>

    </div>

    <!-- ── ANALYSIS TAB ────────────────────────────────────────────── -->
    <div x-show="$store.intelligence.tab === 'analysis'" x-cloak>

      <div class="ip-btn-row" style="margin-bottom:12px;">
        <select class="ip-select" x-model="$store.intelligence.analysisTopic">
          <option value="">— Select topic —</option>
          <template x-for="t in $store.intelligence.topics" :key="t.tag ?? t">
            <option :value="t.tag ?? t" x-text="t.tag ?? t"></option>
          </template>
        </select>
        <button class="ip-btn cyan" @click="$store.intelligence.loadAnalysis()">Analyze</button>
      </div>

      <template x-if="!$store.intelligence.analysisTopic">
        <div class="ip-empty">Select a topic to begin analysis</div>
      </template>

      <!-- DRIFT -->
      <template x-if="$store.intelligence.drift">
        <div class="ip-analysis-block">
          <div class="ip-analysis-head">
            <span class="ip-analysis-title">Drift (72h)</span>
            <span class="ip-analysis-num cyan"
                  x-text="($store.intelligence.drift.claims?.length ?? 0) + ' claims'"></span>
          </div>
          <div style="font-family:var(--font-mono);font-size:10px;color:var(--txt-3);">
            <span x-text="($store.intelligence.drift.contradiction_count ?? 0) + ' contradictions'"></span>
            ·
            <span x-text="($store.intelligence.drift.silent_retcon_count ?? 0) + ' silent retractions'"></span>
          </div>
        </div>
      </template>

      <!-- SILENCE -->
      <template x-if="$store.intelligence.silence">
        <div class="ip-analysis-block">
          <div class="ip-analysis-head">
            <span class="ip-analysis-title">Silence Flags</span>
            <span class="ip-analysis-num"
                  :class="($store.intelligence.silence.total ?? 0) > 0 ? 'warn' : 'ok'"
                  x-text="$store.intelligence.silence.total ?? 0"></span>
          </div>
          <template x-if="$store.intelligence.silence.total > 0">
            <div>
              <template x-for="flag in $store.intelligence.silence.flags.slice(0,5)" :key="flag.id">
                <div class="ip-flag-item">
                  <div x-text="flag.element"></div>
                  <div class="ip-flag-cluster"
                       x-text="'absent from: ' + (flag.absent_from_clusters ?? []).join(', ')"></div>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>

      <!-- ACTIVATION -->
      <template x-if="$store.intelligence.activation">
        <div class="ip-analysis-block">
          <div class="ip-analysis-head">
            <span class="ip-analysis-title">Activation Patterns</span>
            <span class="ip-analysis-num"
                  :class="($store.intelligence.activation.patterns?.length ?? 0) > 0 ? 'danger' : 'ok'"
                  x-text="$store.intelligence.activation.patterns?.length ?? 0"></span>
          </div>
          <template x-for="p in ($store.intelligence.activation.patterns ?? []).slice(0,3)" :key="p.id">
            <div class="ip-flag-item">
              <div x-text="p.claim_pattern ?? p.description"></div>
              <div class="ip-flag-cluster"
                   x-text="'spread: ' + (p.cluster_spread ?? '?') + ' clusters'"></div>
            </div>
          </template>
        </div>
      </template>

      <!-- CONTRADICTIONS -->
      <template x-if="$store.intelligence.contradictions.length > 0">
        <div class="ip-analysis-block">
          <div class="ip-analysis-head">
            <span class="ip-analysis-title">Contradictions</span>
            <span class="ip-analysis-num danger"
                  x-text="$store.intelligence.contradictions.length"></span>
          </div>
          <template x-for="p in $store.intelligence.contradictions.slice(0,3)" :key="p.id">
            <div class="ip-flag-item">
              <div x-text="(p.claim_a_text ?? '').substring(0,80) + '…'"></div>
              <div class="ip-flag-cluster" x-text="p.source_name + ' · ' + p.relationship"></div>
            </div>
          </template>
        </div>
      </template>

    </div>

    <!-- ── HYPOTHESES TAB ──────────────────────────────────────────── -->
    <div x-show="$store.intelligence.tab === 'hypotheses'" x-cloak>

      <!-- Status filter -->
      <div class="ip-btn-row" style="margin-bottom:12px;">
        <template x-for="s in ['ACTIVE','PROMOTED','FALSIFIED','SUSPENDED']" :key="s">
          <button class="ip-btn"
                  :class="$store.intelligence.hypStatus === s ? 'cyan' : ''"
                  @click="$store.intelligence.setHypStatus(s)"
                  x-text="s.charAt(0) + s.slice(1).toLowerCase()">
          </button>
        </template>
      </div>

      <template x-if="$store.intelligence.hypotheses.length === 0 && !$store.intelligence.loading">
        <div class="ip-empty">No hypotheses</div>
      </template>

      <template x-for="h in $store.intelligence.hypotheses" :key="h.hypothesis_id ?? h.id">
        <div class="ip-card ip-card-ai">
          <!-- Header row -->
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
            <span style="font-family:var(--font-mono);font-size:10px;color:var(--txt-3);"
                  x-text="'#' + (h.hypothesis_id ?? h.id)"></span>
            <span class="ip-pill" :class="(h.status ?? '').toLowerCase()"
                  x-text="h.status"></span>
            <span class="ip-header-spacer"></span>
            <span class="ip-hyp-conf" x-text="$store.intelligence.fmtConf(h.current_confidence)"></span>
          </div>

          <!-- Explanation -->
          <div class="ip-claim-text" x-text="h.candidate_explanation ?? h.explanation"></div>

          <!-- Confidence bar -->
          <div class="ip-conf-bar-track">
            <div class="ip-conf-bar-fill"
                 :style="'width:' + $store.intelligence.confBarW(h.current_confidence)">
            </div>
          </div>

          <!-- Prediction counts -->
          <div class="ip-claim-meta" style="margin-bottom:6px;">
            <span x-text="'⬛ ' + (h.predictions_generated?.length ?? 0) + ' predictions'"></span>
            <span x-text="'✓ ' + (h.predictions_confirmed ?? 0) + ' confirmed'"></span>
          </div>

          <!-- Action buttons (only for ACTIVE) -->
          <template x-if="h.status === 'ACTIVE'">
            <div class="ip-btn-row" style="gap:5px;">
              <button class="ip-btn ok"
                      @click="$store.intelligence.promoteHyp(h.hypothesis_id ?? h.id)">
                Promote
              </button>
              <button class="ip-btn danger"
                      @click="$store.intelligence.falsifyHyp(h.hypothesis_id ?? h.id)">
                Falsify
              </button>
              <button class="ip-btn"
                      @click="$store.intelligence.suspendHyp(h.hypothesis_id ?? h.id)">
                Suspend
              </button>
            </div>
          </template>
        </div>
      </template>

    </div>

    <!-- ── PREDICT TAB ─────────────────────────────────────────────── -->
    <div x-show="$store.intelligence.tab === 'predict'" x-cloak>

      <!-- Controls -->
      <div class="ip-btn-row" style="margin-bottom:12px;">
        <select class="ip-select" x-model="$store.intelligence.predictTopic">
          <option value="">— Select topic —</option>
          <template x-for="t in $store.intelligence.topics" :key="t.tag ?? t">
            <option :value="t.tag ?? t" x-text="t.tag ?? t"></option>
          </template>
        </select>
        <button class="ip-btn cyan"
                :disabled="$store.intelligence.swfRunning || !$store.intelligence.predictTopic"
                @click="$store.intelligence.runPredict()">
          <template x-if="$store.intelligence.swfRunning">
            <span class="ip-spin"></span>
          </template>
          <template x-if="!$store.intelligence.swfRunning">
            <span>▶ Predict</span>
          </template>
        </button>
      </div>

      <!-- Consensus result -->
      <template x-if="$store.intelligence.swfConsensus">
        <div class="ip-consensus">
          <div style="display:flex;align-items:baseline;gap:10px;">
            <div class="ip-consensus-val"
                 x-text="Math.round(($store.intelligence.swfConsensus.consensus_probability ?? 0) * 100) + '%'">
            </div>
            <div class="ip-consensus-label">CONSENSUS</div>
          </div>
          <div style="font-family:var(--font-mono);font-size:10px;color:var(--txt-3);margin-top:4px;"
               x-text="'Range: ' + Math.round(($store.intelligence.swfConsensus.range_low ?? 0)*100)
                        + '–' + Math.round(($store.intelligence.swfConsensus.range_high ?? 0)*100) + '%'">
          </div>
        </div>
      </template>

      <!-- Profile cards -->
      <template x-for="p in $store.intelligence.swfProfiles" :key="p.profile_id ?? p.name">
        <div class="ip-profile-card">
          <div>
            <span class="ip-profile-conf"
                  x-text="Math.round((p.probability ?? 0) * 100) + '%'"></span>
            <div class="ip-profile-name" x-text="p.profile_name ?? p.name"></div>
          </div>
          <div class="ip-profile-brief" x-text="p.brief ?? p.reasoning"></div>
        </div>
      </template>

      <template x-if="$store.intelligence.swfProfiles.length === 0 && !$store.intelligence.swfRunning">
        <div class="ip-empty">Select a topic and run predict</div>
      </template>

    </div>

  </div><!-- /ip-content -->

  <!-- ── Toast ───────────────────────────────────────────────────── -->
  <template x-if="$store.intelligence.toast">
    <div class="ip-toast" :class="$store.intelligence.toast.type"
         x-text="$store.intelligence.toast.msg">
    </div>
  </template>

</div><!-- /ip -->

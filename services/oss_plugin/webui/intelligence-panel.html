<!-- intelligence-panel.html — Agent Zero right-canvas Intelligence Surface -->

<style>
/* ── Design System Tokens ─────────────────────────────────────── */
.ip {
  /* ── Theme-aware: tokens map onto the active A0 theme (mgs3/codec/idroid/…),
        with the original indigo palette as fallback when no theme var is set. ── */

  /* Structural surfaces */
  --void:    var(--color-background, #060810);
  --base:    var(--color-background, #0a0f1a);
  --raised:  var(--color-panel, #0f1629);
  --overlay: color-mix(in srgb, var(--color-panel, #151d35) 80%, var(--color-text, #fff) 8%);
  --border:  var(--color-border, rgba(255,255,255,.07));
  --border-hi: color-mix(in srgb, var(--color-border, rgba(255,255,255,.14)) 55%, var(--color-text, #fff) 22%);

  /* Structural accent → theme accent */
  --cyan:      var(--color-accent, #4fc3f7);
  --cyan-dim:  color-mix(in srgb, var(--color-accent, #4fc3f7) 14%, transparent);
  --cyan-glow: 0 0 12px color-mix(in srgb, var(--color-accent, #4fc3f7) 32%, transparent);

  /* Attention accent → theme warning */
  --amber:     var(--color-warning-text, #f59e0b);
  --amber-dim: color-mix(in srgb, var(--color-warning-text, #f59e0b) 14%, transparent);
  --amber-glow: 0 0 10px color-mix(in srgb, var(--color-warning-text, #f59e0b) 30%, transparent);

  /* Semantic — themes lack a success token, so --ok keeps its green */
  --ok:       #34d399;
  --ok-dim:   rgba(52,211,153,.12);
  --danger:   var(--color-error-text, #f87171);
  --danger-dim: color-mix(in srgb, var(--color-error-text, #f87171) 14%, transparent);
  --info:     var(--color-primary, #60a5fa);

  /* Text hierarchy → theme text */
  --txt-1:  var(--color-text, #e8ecf2);
  --txt-2:  var(--color-text-muted, #9ba8bb);
  --txt-3:  color-mix(in srgb, var(--color-text-muted, #556070) 72%, transparent);
  --txt-dim: color-mix(in srgb, var(--color-text-muted, #2d3545) 38%, transparent);

  --font-body: var(--font-family-main, "Inter", system-ui, sans-serif);
  --font-mono: var(--font-family-code, "JetBrains Mono", "IBM Plex Mono", "Consolas", monospace);

  /* Spring-eased cubic-bezier for overshoot feel */
  --spring:   cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --t-fast:   0.15s;
  --t-norm:   0.25s;

  --r-sm:   6px;
  --r-md:   10px;
  --r-pill: 999px;
}

/* ── Base Layout ──────────────────────────────────────────────── */
.ip {
  display: flex;
  flex-direction: column;
  height: 100%;
  background: var(--base);
  color: var(--txt-1);
  font-family: var(--font-body);
  font-size: 13px;
  overflow: hidden;
  position: relative;
}

/* ── Header ───────────────────────────────────────────────────── */
.ip-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 14px;
  background: var(--void);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.ip-title {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--cyan);
}

.ip-header-spacer { flex: 1; }

/* Live ingest pulse */
.ip-live-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--ok);
  box-shadow: 0 0 6px var(--ok);
  flex-shrink: 0;
}
.ip-live-dot.live { animation: ip-breathe 2s ease-in-out infinite; }
.ip-live-dot.paused { background: var(--amber); box-shadow: 0 0 6px var(--amber); animation: none; }
.ip-live-dot.unknown { background: var(--txt-dim); box-shadow: none; animation: none; }
@keyframes ip-breathe {
  0%,100% { opacity: 1; transform: scale(1); }
  50%      { opacity: .45; transform: scale(.75); }
}

.ip-ingest-label {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: .1em;
  text-transform: uppercase;
}
.ip-ingest-label.live   { color: var(--ok); }
.ip-ingest-label.paused { color: var(--amber); }
.ip-ingest-label.unknown { color: var(--txt-3); }

/* Quick controls in header */
.ip-hbtn {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  color: var(--txt-3);
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: .06em;
  padding: 2px 7px;
  cursor: pointer;
  transition: color var(--t-fast), border-color var(--t-fast), background var(--t-fast),
              transform 80ms cubic-bezier(0.4,0,0.2,1);
}
.ip-hbtn:active { transform: scale(0.93); }
.ip-hbtn.ok  { color: var(--ok);    border-color: var(--ok); }
.ip-hbtn.ok:hover  { background: var(--ok-dim); }
.ip-hbtn.amber { color: var(--amber); border-color: var(--amber); }
.ip-hbtn.amber:hover { background: var(--amber-dim); }

/* ── Persistent Status Bar ────────────────────────────────────── */
.ip-statusbar {
  display: flex;
  align-items: stretch;
  background: var(--void);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.ip-sb-stat {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px 4px 7px;
  position: relative;
  cursor: default;
}
.ip-sb-stat + .ip-sb-stat::before {
  content: '';
  position: absolute;
  left: 0; top: 20%; bottom: 20%;
  width: 1px;
  background: var(--border);
}

.ip-sb-val {
  font-family: var(--font-mono);
  font-size: 19px;
  font-weight: 700;
  line-height: 1;
  transition: color var(--t-fast);
}
.ip-sb-val.staged   { color: var(--amber); }
.ip-sb-val.promoted { color: var(--ok); }
.ip-sb-val.neutral  { color: var(--txt-1); }
.ip-sb-val.cyan     { color: var(--cyan); }

.ip-sb-val.pulse {
  animation: ip-val-pulse .35s var(--spring);
}
@keyframes ip-val-pulse {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.18); }
  100% { transform: scale(1); }
}

.ip-sb-lbl {
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--txt-3);
  margin-top: 3px;
}

/* ── Tab Bar ──────────────────────────────────────────────────── */
.ip-tabs {
  display: flex;
  background: var(--void);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.ip-tabs::-webkit-scrollbar { display: none; }

.ip-tab {
  flex: 1;
  padding: 7px 4px;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--txt-3);
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  cursor: pointer;
  transition: color var(--t-fast), border-color var(--t-norm) var(--ease-out);
  white-space: nowrap;
}
.ip-tab:hover { color: var(--txt-2); }
.ip-tab.active { color: var(--cyan); border-bottom-color: var(--cyan); }

/* ── Content scroll area ──────────────────────────────────────── */
.ip-content {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  scrollbar-width: thin;
  scrollbar-color: var(--overlay) transparent;
}
.ip-content::-webkit-scrollbar { width: 3px; }
.ip-content::-webkit-scrollbar-thumb { background: var(--overlay); border-radius: 2px; }

/* ── Shared Components ────────────────────────────────────────── */
.ip-section { margin-bottom: 14px; }

.ip-section-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 7px;
}
.ip-section-lbl {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--txt-3);
}

.ip-card {
  background: var(--raised);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 9px 11px;
  margin-bottom: 7px;
  transition: border-color var(--t-fast);
  /* Enter animation — with keyed x-for, only newly-arrived items animate */
  animation: ip-slide-up .26s var(--ease-out) both;
}
.ip-card:hover { border-color: var(--border-hi); }
.ip-card.accent { border-color: rgba(79,195,247,.2); box-shadow: 0 0 0 1px rgba(79,195,247,.06) inset; }

/* Buttons */
.ip-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 9px;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--overlay);
  color: var(--txt-2);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .06em;
  cursor: pointer;
  transition: background var(--t-fast), border-color var(--t-fast), color var(--t-fast),
              transform 80ms cubic-bezier(0.4,0,0.2,1);
}
.ip-btn:hover     { background: rgba(255,255,255,.06); border-color: var(--border-hi); color: var(--txt-1); }
.ip-btn:active    { transform: scale(0.94); }
.ip-btn:disabled  { opacity: .35; cursor: not-allowed; transform: none; }
.ip-btn.cyan      { border-color: rgba(79,195,247,.5); color: var(--cyan); }
.ip-btn.cyan:hover{ background: var(--cyan-dim); }
.ip-btn.ok        { border-color: rgba(52,211,153,.5); color: var(--ok); }
.ip-btn.ok:hover  { background: var(--ok-dim); }
.ip-btn.amber     { border-color: rgba(245,158,11,.5); color: var(--amber); }
.ip-btn.amber:hover{ background: var(--amber-dim); }
.ip-btn.danger    { border-color: rgba(248,113,113,.5); color: var(--danger); }
.ip-btn.danger:hover { background: var(--danger-dim); }

.ip-btn-row { display: flex; gap: 5px; margin-bottom: 9px; flex-wrap: wrap; }

.ip-icon-btn {
  background: transparent;
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  color: var(--txt-3);
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  font-size: 13px; padding: 0; flex-shrink: 0;
  transition: border-color var(--t-fast), color var(--t-fast), transform 80ms cubic-bezier(0.4,0,0.2,1);
}
.ip-icon-btn:hover  { border-color: var(--border-hi); color: var(--txt-1); }
.ip-icon-btn:active { transform: scale(0.9); }
.ip-icon-btn.ok { color: var(--ok); border-color: rgba(52,211,153,.4); }
.ip-icon-btn.ok:hover { background: var(--ok-dim); }

/* Select */
.ip-select {
  background: var(--raised);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  color: var(--txt-1);
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 4px 7px;
  outline: none;
  cursor: pointer;
  transition: border-color var(--t-fast);
}
.ip-select:focus { border-color: rgba(79,195,247,.4); }

/* Text input */
.ip-input {
  flex: 1;
  background: var(--raised);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  padding: 4px 7px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--txt-1);
  outline: none;
  transition: border-color var(--t-fast);
}
.ip-input:focus { border-color: rgba(79,195,247,.4); }
.ip-input::placeholder { color: var(--txt-3); }

/* Pills */
.ip-pill {
  display: inline-flex; align-items: center;
  padding: 1px 6px;
  border-radius: var(--r-pill);
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
}
.ip-pill.staged     { background: rgba(245,158,11,.12);  color: var(--amber); border: 1px solid rgba(245,158,11,.3); }
.ip-pill.promoted   { background: var(--ok-dim);         color: var(--ok);    border: 1px solid rgba(52,211,153,.3); }
.ip-pill.falsified  { background: var(--danger-dim);     color: var(--danger); border: 1px solid rgba(248,113,113,.3); }
.ip-pill.active     { background: var(--cyan-dim);       color: var(--cyan);  border: 1px solid rgba(79,195,247,.3); }
.ip-pill.suspended  { background: rgba(255,255,255,.05); color: var(--txt-3); border: 1px solid var(--border); }
.ip-pill.tag        { background: rgba(96,165,250,.1);   color: var(--info);  border: 1px solid rgba(96,165,250,.25); }

/* Claim text */
.ip-claim-text {
  font-size: 12px;
  color: var(--txt-2);
  line-height: 1.45;
  margin: 4px 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.ip-claim-meta {
  display: flex; gap: 7px; align-items: center;
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--txt-3);
}

/* Confidence bar */
.ip-conf-track {
  height: 2px;
  background: var(--overlay);
  border-radius: 2px;
  margin: 6px 0;
  overflow: hidden;
}
.ip-conf-fill {
  height: 100%;
  background: var(--cyan);
  border-radius: 2px;
  transition: width 0.5s var(--ease-out);
}

/* Empty / error states */
.ip-empty {
  text-align: center;
  padding: 32px 16px;
  color: var(--txt-3);
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: .06em;
}
.ip-empty-icon { font-size: 22px; margin-bottom: 8px; opacity: .4; }

.ip-error {
  background: var(--danger-dim);
  border: 1px solid rgba(248,113,113,.25);
  border-radius: var(--r-sm);
  padding: 7px 10px;
  color: var(--danger);
  font-family: var(--font-mono);
  font-size: 10px;
  margin-bottom: 10px;
}

/* Spinner */
.ip-spin {
  display: inline-block;
  width: 11px; height: 11px;
  border: 2px solid var(--border);
  border-top-color: var(--cyan);
  border-radius: 50%;
  animation: ip-rotate .7s linear infinite;
}
@keyframes ip-rotate { to { transform: rotate(360deg); } }

/* Loading skeleton shimmer */
.ip-skeleton {
  background: linear-gradient(90deg, var(--raised) 25%, var(--overlay) 50%, var(--raised) 75%);
  background-size: 200% 100%;
  animation: ip-shimmer 1.5s ease-in-out infinite;
  border-radius: var(--r-sm);
  height: 11px;
  margin-bottom: 6px;
}
@keyframes ip-shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* Ingest controls row */
.ip-ingest-row {
  display: flex; align-items: center;
  gap: 6px;
  margin-bottom: 12px;
  padding: 0 1px;
}
.ip-ingest-age {
  flex: 1;
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--txt-3);
}

/* Source compact list */
.ip-src-list { display: flex; flex-direction: column; gap: 2px; }
.ip-src-row {
  display: flex; align-items: center; gap: 7px;
  padding: 3px 4px;
  border-radius: var(--r-sm);
  transition: background var(--t-fast);
}
.ip-src-row:hover { background: var(--raised); }
.ip-src-dot { font-size: 7px; flex-shrink: 0; }
.ip-src-dot.ok    { color: var(--ok); }
.ip-src-dot.err   { color: var(--danger); }
.ip-src-dot.stale { color: var(--amber); }
.ip-src-name { flex: 1; font-size: 11px; color: var(--txt-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ip-src-count { font-family: var(--font-mono); font-size: 9px; color: var(--txt-3); flex-shrink: 0; }

/* Analysis blocks */
.ip-ablock {
  background: var(--raised);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  padding: 9px 11px;
  margin-bottom: 9px;
}
.ip-ablock-hdr {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 7px;
}
.ip-ablock-title {
  flex: 1;
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--txt-3);
}
.ip-ablock-num {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 700;
}
.ip-ablock-num.ok     { color: var(--ok); }
.ip-ablock-num.amber  { color: var(--amber); }
.ip-ablock-num.danger { color: var(--danger); }
.ip-ablock-num.cyan   { color: var(--cyan); }

.ip-flag {
  padding: 4px 0;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  color: var(--txt-2);
}
.ip-flag:last-child { border-bottom: none; }
.ip-flag-sub { font-family: var(--font-mono); font-size: 9px; color: var(--txt-3); }

/* Hypothesis confidence */
.ip-hyp-conf { font-family: var(--font-mono); font-size: 11px; color: var(--cyan); }

/* ── PREDICT TAB specific ─────────────────────────────────────── */

/* Running state overlay */
.ip-committee-working {
  background: var(--raised);
  border: 1px solid rgba(79,195,247,.2);
  border-radius: var(--r-md);
  padding: 20px 16px;
  text-align: center;
  margin-bottom: 12px;
}
.ip-committee-status {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--cyan);
  letter-spacing: .1em;
  margin-top: 10px;
}

/* Consensus card */
.ip-consensus {
  background: var(--raised);
  border: 1px solid rgba(79,195,247,.25);
  border-radius: var(--r-md);
  padding: 14px;
  margin-bottom: 10px;
  box-shadow: var(--cyan-glow);
  animation: ip-slide-up .35s var(--ease-out);
}
.ip-consensus-val {
  font-family: var(--font-mono);
  font-size: 36px;
  font-weight: 700;
  color: var(--cyan);
  line-height: 1;
}
.ip-consensus-lbl {
  font-family: var(--font-mono);
  font-size: 9px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--txt-3);
  margin-top: 2px;
}
.ip-consensus-range {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--txt-3);
  margin-top: 6px;
}

/* Profile assessment card */
.ip-profile-card {
  background: var(--raised);
  border: 1px solid var(--border);
  border-left: 2px solid var(--cyan);
  border-radius: var(--r-md);
  padding: 9px 11px;
  margin-bottom: 7px;
  animation: ip-slide-up .3s var(--ease-out);
}
@keyframes ip-slide-up {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}
.ip-profile-hdr { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.ip-profile-name { font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: var(--txt-2); flex: 1; }
.ip-profile-conf { font-family: var(--font-mono); font-size: 15px; font-weight: 700; color: var(--cyan); }
.ip-profile-brief { font-size: 11px; color: var(--txt-3); line-height: 1.4; }

/* Session history */
.ip-session-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 0;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  animation: ip-slide-up .26s var(--ease-out) both;
}
.ip-session-row:last-child { border-bottom: none; }
.ip-session-q {
  flex: 1;
  color: var(--txt-2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.ip-session-conf {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--cyan);
  flex-shrink: 0;
}
.ip-session-date {
  font-family: var(--font-mono);
  font-size: 9px;
  color: var(--txt-3);
  flex-shrink: 0;
}

/* SWARMFISH stats row */
.ip-swf-stats {
  display: flex;
  gap: 0;
  background: var(--raised);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  overflow: hidden;
  margin-bottom: 10px;
}
.ip-swf-stat {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 8px 4px;
}
.ip-swf-stat + .ip-swf-stat { border-left: 1px solid var(--border); }
.ip-swf-val {
  font-family: var(--font-mono);
  font-size: 16px;
  font-weight: 700;
  color: var(--txt-1);
  line-height: 1;
}
.ip-swf-lbl {
  font-family: var(--font-mono);
  font-size: 8px;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--txt-3);
  margin-top: 3px;
}

/* ── MAGI committee — consensus verdict + node grid ──────────────── */
.ip-consensus-top { display: flex; align-items: center; gap: 14px; }
.ip-consensus-meta { flex: 1; min-width: 0; }
.ip-gauge-row { display: flex; align-items: center; gap: 6px; margin-top: 5px; }
.ip-gauge-lbl {
  font-family: var(--font-mono); font-size: 8px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--txt-3); width: 30px; flex-shrink: 0;
}
.ip-gauge {
  flex: 1; height: 4px; background: var(--overlay);
  border-radius: var(--r-pill); overflow: hidden;
}
.ip-gauge-fill {
  height: 100%; background: var(--cyan); border-radius: var(--r-pill);
  transition: width .5s var(--ease-out);
}
.ip-gauge-fill.warn { background: var(--amber); }
.ip-gauge-val {
  font-family: var(--font-mono); font-size: 9px; color: var(--txt-2);
  width: 30px; text-align: right; flex-shrink: 0;
}
.ip-consensus-brief {
  margin-top: 11px; padding-top: 10px;
  border-top: 1px solid var(--border);
  font-size: 11px; line-height: 1.5; color: var(--txt-2);
}
.ip-dissent {
  display: flex; align-items: baseline; gap: 7px; margin-top: 9px;
}
.ip-dissent-lbl {
  font-family: var(--font-mono); font-size: 9px; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase; color: var(--amber);
  flex-shrink: 0;
}
.ip-dissent-names { font-family: var(--font-mono); font-size: 10px; color: var(--txt-3); }

.ip-section-count {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: .06em;
  color: var(--txt-3); margin-left: auto;
}

.ip-node-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 7px;
}
.ip-node {
  background: var(--raised);
  border: 1px solid var(--border);
  border-top: 2px solid var(--cyan);
  border-radius: var(--r-sm);
  padding: 8px 9px;
  animation: ip-node-in .32s var(--ease-out) both;
}
.ip-node.err { border-top-color: var(--danger); opacity: .7; }
@keyframes ip-node-in {
  from { opacity: 0; transform: translateY(8px) scale(.98); }
  to   { opacity: 1; transform: none; }
}
.ip-node-hdr { display: flex; align-items: baseline; gap: 6px; }
.ip-node-name {
  font-family: var(--font-mono); font-size: 9px; font-weight: 700;
  letter-spacing: .04em; text-transform: uppercase; color: var(--txt-2);
  flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ip-node-conf {
  font-family: var(--font-mono); font-size: 14px; font-weight: 700;
  color: var(--cyan); flex-shrink: 0;
}
.ip-node-bar {
  height: 3px; background: var(--overlay); border-radius: var(--r-pill);
  overflow: hidden; margin: 5px 0 6px;
}
.ip-node-bar-fill {
  height: 100%; background: var(--cyan); border-radius: var(--r-pill);
  transition: width .5s var(--ease-out);
}
.ip-node-verdict {
  font-family: var(--font-mono); font-size: 10px; color: var(--txt-1);
  margin-bottom: 3px; line-height: 1.3;
}
.ip-node-reason { font-size: 10px; color: var(--txt-3); line-height: 1.4; }
.ip-node-tags { display: flex; gap: 4px; margin-top: 5px; }
.ip-node-tag {
  font-family: var(--font-mono); font-size: 8px; letter-spacing: .05em;
  text-transform: uppercase; padding: 1px 5px; border-radius: var(--r-sm);
}
.ip-node-tag.cap { background: var(--amber-dim); color: var(--amber); }
.ip-node-tag.err { background: var(--danger-dim); color: var(--danger); }

/* ── Calibration ledger ──────────────────────────────────────────── */
.ip-cal-row {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; margin-bottom: 5px;
  background: var(--raised);
  border: 1px solid var(--border);
  border-left: 3px solid var(--txt-dim);
  border-radius: var(--r-sm);
  animation: ip-slide-up .26s var(--ease-out) both;
}
.ip-cal-row.b-good { border-left-color: var(--ok); }
.ip-cal-row.b-ok   { border-left-color: var(--cyan); }
.ip-cal-row.b-poor { border-left-color: var(--amber); }
.ip-cal-row.b-none { border-left-color: var(--txt-dim); opacity: .6; }
.ip-cal-name {
  flex: 1; font-family: var(--font-mono); font-size: 10px; font-weight: 700;
  color: var(--txt-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ip-cal-metrics { display: flex; align-items: baseline; gap: 10px; flex-shrink: 0; }
.ip-cal-brier {
  font-family: var(--font-mono); font-size: 14px; font-weight: 700; color: var(--txt-1);
}
.b-good .ip-cal-brier { color: var(--ok); }
.b-ok   .ip-cal-brier { color: var(--cyan); }
.b-poor .ip-cal-brier { color: var(--amber); }
.ip-cal-acc { font-family: var(--font-mono); font-size: 10px; color: var(--txt-2); }
.ip-cal-n   { font-family: var(--font-mono); font-size: 9px; color: var(--txt-3); }

/* Topics wrap */
.ip-topic-row { display: flex; flex-wrap: wrap; gap: 5px; }
.ip-topic-chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px;
  background: var(--raised);
  border: 1px solid var(--border);
  border-radius: var(--r-pill);
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--txt-2);
}
.ip-topic-chip-count { font-size: 9px; color: var(--txt-3); }

/* Checkbox */
.ip-check { accent-color: var(--cyan); width: 13px; height: 13px; cursor: pointer; flex-shrink: 0; }

/* Toast */
.ip-toast {
  position: absolute;
  bottom: 10px; left: 10px; right: 10px;
  padding: 7px 11px;
  border-radius: var(--r-sm);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  z-index: 99;
  animation: ip-slide-up .22s var(--ease-out);
}
.ip-toast.ok     { background: var(--ok-dim);     border: 1px solid rgba(52,211,153,.35); color: var(--ok); }
.ip-toast.warn   { background: var(--amber-dim);  border: 1px solid rgba(245,158,11,.35); color: var(--amber); }
.ip-toast.danger { background: var(--danger-dim); border: 1px solid rgba(248,113,113,.35); color: var(--danger); }
.ip-toast.info   { background: rgba(96,165,250,.1); border: 1px solid rgba(96,165,250,.35); color: var(--info); }

/* Accessibility */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>

<!-- ── Panel Root ──────────────────────────────────────────────── -->
<div class="ip" x-data="{}">

  <!-- ── Header ─────────────────────────────────────────────────── -->
  <div class="ip-header">
    <span class="ip-title">Intelligence</span>

    <span class="ip-header-spacer"></span>

    <!-- Live / Paused indicator -->
    <template x-if="$store.intelligence.health">
      <span style="display:flex;align-items:center;gap:5px;">
        <span class="ip-live-dot"
              :class="$store.intelligence.ingestPaused ? 'paused' : 'live'"></span>
        <span class="ip-ingest-label"
              :class="$store.intelligence.ingestPaused ? 'paused' : 'live'"
              x-text="$store.intelligence.ingestPaused ? 'paused' : 'live'"></span>
      </span>
    </template>

    <!-- Quick ingest toggle -->
    <template x-if="$store.intelligence.health && $store.intelligence.ingestPaused">
      <button class="ip-hbtn ok" style="margin-left:6px;"
              @click="$store.intelligence.resumeIngest()">▶ resume</button>
    </template>
    <template x-if="$store.intelligence.health && !$store.intelligence.ingestPaused">
      <button class="ip-hbtn amber" style="margin-left:6px;"
              @click="$store.intelligence.pauseIngest()">⏸ pause</button>
    </template>
  </div>

  <!-- ── Status Bar ─────────────────────────────────────────────── -->
  <div class="ip-statusbar">
    <div class="ip-sb-stat" title="Claims awaiting triage"
         @click="$store.intelligence.setTab('triage')" style="cursor:pointer;">
      <span class="ip-sb-val staged"
            x-text="$store.intelligence.claimsStaged.toLocaleString()">—</span>
      <span class="ip-sb-lbl">staged</span>
    </div>
    <div class="ip-sb-stat" title="Promoted claims in ledger"
         @click="$store.intelligence.setTab('ledger')" style="cursor:pointer;">
      <span class="ip-sb-val promoted"
            x-text="$store.intelligence.claimsPromoted.toLocaleString()">—</span>
      <span class="ip-sb-lbl">promoted</span>
    </div>
    <div class="ip-sb-stat" title="Active sources">
      <span class="ip-sb-val neutral"
            x-text="$store.intelligence.sourcesCount">—</span>
      <span class="ip-sb-lbl">sources</span>
    </div>
    <div class="ip-sb-stat" title="Tracked hypotheses"
         @click="$store.intelligence.setTab('hypotheses')" style="cursor:pointer;">
      <span class="ip-sb-val cyan"
            x-text="$store.intelligence.hypothesisCount">—</span>
      <span class="ip-sb-lbl">hypotheses</span>
    </div>
  </div>

  <!-- ── Tab Bar ─────────────────────────────────────────────────── -->
  <div class="ip-tabs">
    <template x-for="t in ['status','triage','ledger','analysis','hypotheses','predict','calibrate']" :key="t">
      <button class="ip-tab"
              :class="$store.intelligence.tab === t ? 'active' : ''"
              @click="$store.intelligence.setTab(t)"
              x-text="t === 'predict' ? 'Predict' : t === 'calibrate' ? 'Calibrate' : t.charAt(0).toUpperCase() + t.slice(1)">
      </button>
    </template>
  </div>

  <!-- ── Content ─────────────────────────────────────────────────── -->
  <div class="ip-content">

    <!-- Error banner -->
    <div x-show="$store.intelligence.error" x-cloak class="ip-error"
         x-text="'⚠ ' + $store.intelligence.error"></div>

    <!-- Loading skeleton -->
    <template x-if="$store.intelligence.loading && !$store.intelligence.error">
      <div>
        <div class="ip-skeleton" style="width:60%;height:9px;margin-bottom:10px;"></div>
        <div class="ip-skeleton" style="width:100%;height:52px;border-radius:10px;margin-bottom:8px;"></div>
        <div class="ip-skeleton" style="width:100%;height:38px;border-radius:10px;margin-bottom:8px;"></div>
        <div class="ip-skeleton" style="width:80%;height:38px;border-radius:10px;"></div>
      </div>
    </template>

    <!-- ── STATUS TAB ──────────────────────────────────────────────── -->
    <div x-show="$store.intelligence.tab === 'status' && !$store.intelligence.loading" x-cloak>

      <!-- Ingest controls row -->
      <template x-if="$store.intelligence.health">
        <div class="ip-ingest-row">
          <span class="ip-ingest-age"
                x-text="'last run: ' + $store.intelligence.timeSince($store.intelligence.health.last_ingestion)">
          </span>
          <button class="ip-btn" :disabled="$store.intelligence.loading"
                  @click="$store.intelligence.runIngestNow()">⟳ run</button>
          <template x-if="$store.intelligence.ingestPaused">
            <button class="ip-btn ok" @click="$store.intelligence.resumeIngest()">▶ resume</button>
          </template>
          <template x-if="!$store.intelligence.ingestPaused">
            <button class="ip-btn amber" @click="$store.intelligence.pauseIngest()">⏸ pause</button>
          </template>
        </div>
      </template>

      <!-- Topics -->
      <div class="ip-section">
        <div class="ip-section-hdr">
          <span class="ip-section-lbl">Topics</span>
          <button class="ip-icon-btn"
                  :class="$store.intelligence.addTopicOpen ? 'ok' : ''"
                  @click="$store.intelligence.addTopicOpen = !$store.intelligence.addTopicOpen"
                  title="Add topic">+</button>
        </div>
        <template x-if="$store.intelligence.addTopicOpen">
          <div style="display:flex;align-items:center;gap:4px;margin-bottom:8px;">
            <input class="ip-input" type="text" placeholder="slug (e.g. iran-hormuz)"
                   x-model="$store.intelligence.addTopicInput"
                   @keydown.enter="$store.intelligence.addTopic()"
                   @keydown.escape="$store.intelligence.addTopicOpen = false">
            <button class="ip-icon-btn ok"
                    :disabled="!$store.intelligence.addTopicInput.trim()"
                    @click="$store.intelligence.addTopic()">✓</button>
          </div>
        </template>
        <template x-if="$store.intelligence.topics.length === 0">
          <div class="ip-empty"><div class="ip-empty-icon">◌</div>No topics configured</div>
        </template>
        <div class="ip-topic-row">
          <template x-for="t in $store.intelligence.topics" :key="t.tag ?? t">
            <span class="ip-topic-chip">
              <span x-text="t.tag ?? t"></span>
              <span class="ip-topic-chip-count"
                    x-text="t.claim_count != null ? t.claim_count.toLocaleString() : '0'"></span>
            </span>
          </template>
        </div>
      </div>

      <!-- Sources -->
      <template x-if="$store.intelligence.sources.length">
        <div class="ip-section">
          <div class="ip-section-hdr"><span class="ip-section-lbl">Sources</span></div>
          <div class="ip-src-list">
            <template x-for="s in $store.intelligence.sources.slice(0,12)" :key="s.id ?? s.name">
              <div class="ip-src-row">
                <span class="ip-src-dot"
                      :class="s.last_fetch_error ? 'err' : (s.claim_count === 0 ? 'stale' : 'ok')">●</span>
                <span class="ip-src-name" x-text="s.name"></span>
                <span class="ip-src-count" x-text="(s.claim_count ?? 0).toLocaleString()"></span>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- Empty state -->
      <template x-if="!$store.intelligence.health && !$store.intelligence.loading">
        <div class="ip-empty">
          <div class="ip-empty-icon">⌖</div>
          Connecting to intelligence pipeline…
        </div>
      </template>

    </div>

    <!-- ── TRIAGE TAB ──────────────────────────────────────────────── -->
    <div x-show="$store.intelligence.tab === 'triage' && !$store.intelligence.loading" x-cloak>

      <div class="ip-btn-row">
        <select class="ip-select" x-model="$store.intelligence.triageTopic"
                @change="$store.intelligence.loadStaged()">
          <option value="">— All topics —</option>
          <template x-for="t in $store.intelligence.topics" :key="t.tag ?? t">
            <option :value="t.tag ?? t" x-text="t.tag ?? t"></option>
          </template>
        </select>
        <button class="ip-btn" @click="$store.intelligence.selectAll()">All</button>
        <button class="ip-btn" @click="$store.intelligence.clearSel()">None</button>
      </div>

      <template x-if="$store.intelligence.triageSel.length > 0">
        <div class="ip-btn-row">
          <button class="ip-btn ok" @click="$store.intelligence.bulkPromote()">
            ✓ Promote <span x-text="'(' + $store.intelligence.triageSel.length + ')'"></span>
          </button>
        </div>
      </template>

      <div style="font-family:var(--font-mono);font-size:9px;color:var(--txt-3);margin-bottom:9px;"
           x-text="$store.intelligence.stagedTotal.toLocaleString() + ' awaiting triage'">
      </div>

      <template x-if="$store.intelligence.staged.length === 0">
        <div class="ip-empty"><div class="ip-empty-icon">✓</div>No staged claims</div>
      </template>

      <template x-for="c in $store.intelligence.staged" :key="c.id">
        <div class="ip-card" style="display:flex;gap:8px;align-items:flex-start;">
          <input type="checkbox" class="ip-check"
                 :checked="$store.intelligence.isSel(c.id)"
                 @change="$store.intelligence.toggleSel(c.id)">
          <div style="flex:1;min-width:0;">
            <div class="ip-claim-meta">
              <span x-text="c.source_name ?? '—'"></span>
              <span x-text="$store.intelligence.fmtDate(c.published_at ?? c.extracted_at)"></span>
              <span class="ip-pill staged" x-text="$store.intelligence.techniqueLabel(c.technique_class)"></span>
            </div>
            <div class="ip-claim-text" x-text="c.claim_text"></div>
          </div>
        </div>
      </template>

    </div>

    <!-- ── LEDGER TAB ──────────────────────────────────────────────── -->
    <div x-show="$store.intelligence.tab === 'ledger' && !$store.intelligence.loading" x-cloak>

      <div class="ip-btn-row" style="margin-bottom:10px;">
        <select class="ip-select" x-model="$store.intelligence.ledgerTopic"
                @change="$store.intelligence.loadLedger()">
          <option value="">— All topics —</option>
          <template x-for="t in $store.intelligence.topics" :key="t.tag ?? t">
            <option :value="t.tag ?? t" x-text="t.tag ?? t"></option>
          </template>
        </select>
      </div>

      <div style="font-family:var(--font-mono);font-size:9px;color:var(--txt-3);margin-bottom:9px;"
           x-text="$store.intelligence.ledgerTotal.toLocaleString() + ' promoted claims'">
      </div>

      <template x-if="$store.intelligence.ledger.length === 0">
        <div class="ip-empty"><div class="ip-empty-icon">◌</div>No promoted claims</div>
      </template>

      <template x-for="c in $store.intelligence.ledger" :key="c.id">
        <div class="ip-card">
          <div class="ip-claim-meta">
            <span x-text="c.source_name ?? '—'"></span>
            <span x-text="$store.intelligence.fmtDate(c.published_at ?? c.extracted_at)"></span>
            <span class="ip-pill promoted">✓</span>
            <span class="ip-pill tag" x-text="$store.intelligence.techniqueLabel(c.technique_class)"></span>
          </div>
          <div class="ip-claim-text" x-text="c.claim_text"></div>
          <a :href="c.article_url" target="_blank"
             style="font-family:var(--font-mono);font-size:9px;color:var(--cyan);text-decoration:none;"
             x-show="c.article_url">↗ source</a>
        </div>
      </template>

    </div>

    <!-- ── ANALYSIS TAB ────────────────────────────────────────────── -->
    <div x-show="$store.intelligence.tab === 'analysis' && !$store.intelligence.loading" x-cloak>

      <div class="ip-btn-row" style="margin-bottom:10px;">
        <select class="ip-select" x-model="$store.intelligence.analysisTopic">
          <option value="">— Select topic —</option>
          <template x-for="t in $store.intelligence.topics" :key="t.tag ?? t">
            <option :value="t.tag ?? t" x-text="t.tag ?? t"></option>
          </template>
        </select>
        <button class="ip-btn cyan" @click="$store.intelligence.loadAnalysis()">Analyze</button>
      </div>

      <template x-if="!$store.intelligence.analysisTopic">
        <div class="ip-empty"><div class="ip-empty-icon">◎</div>Select a topic to begin</div>
      </template>

      <template x-if="$store.intelligence.drift">
        <div class="ip-ablock">
          <div class="ip-ablock-hdr">
            <span class="ip-ablock-title">Drift (72h)</span>
            <span class="ip-ablock-num cyan"
                  x-text="($store.intelligence.drift.claims?.length ?? 0) + ' claims'"></span>
          </div>
          <div style="font-family:var(--font-mono);font-size:9px;color:var(--txt-3);">
            <span x-text="($store.intelligence.drift.contradiction_count ?? 0) + ' contradictions'"></span>
            ·
            <span x-text="($store.intelligence.drift.silent_retcon_count ?? 0) + ' silent retractions'"></span>
          </div>
        </div>
      </template>

      <template x-if="$store.intelligence.silence">
        <div class="ip-ablock">
          <div class="ip-ablock-hdr">
            <span class="ip-ablock-title">Silence Flags</span>
            <span class="ip-ablock-num"
                  :class="($store.intelligence.silence.total ?? 0) > 0 ? 'amber' : 'ok'"
                  x-text="$store.intelligence.silence.total ?? 0"></span>
          </div>
          <template x-if="$store.intelligence.silence.total > 0">
            <div>
              <template x-for="flag in $store.intelligence.silence.flags.slice(0,5)" :key="flag.id">
                <div class="ip-flag">
                  <div x-text="flag.element"></div>
                  <div class="ip-flag-sub"
                       x-text="'absent from: ' + (flag.absent_from_clusters ?? []).join(', ')"></div>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>

      <template x-if="$store.intelligence.activation">
        <div class="ip-ablock">
          <div class="ip-ablock-hdr">
            <span class="ip-ablock-title">Activation Patterns</span>
            <span class="ip-ablock-num"
                  :class="($store.intelligence.activation.patterns?.length ?? 0) > 0 ? 'danger' : 'ok'"
                  x-text="$store.intelligence.activation.patterns?.length ?? 0"></span>
          </div>
          <template x-for="p in ($store.intelligence.activation.patterns ?? []).slice(0,3)" :key="p.id">
            <div class="ip-flag">
              <div x-text="p.claim_pattern ?? p.description"></div>
              <div class="ip-flag-sub" x-text="'spread: ' + (p.cluster_spread ?? '?') + ' clusters'"></div>
            </div>
          </template>
        </div>
      </template>

      <template x-if="$store.intelligence.contradictions.length > 0">
        <div class="ip-ablock">
          <div class="ip-ablock-hdr">
            <span class="ip-ablock-title">Contradictions</span>
            <span class="ip-ablock-num danger"
                  x-text="$store.intelligence.contradictions.length"></span>
          </div>
          <template x-for="p in $store.intelligence.contradictions.slice(0,3)" :key="p.id">
            <div class="ip-flag">
              <div x-text="(p.claim_a_text ?? '').substring(0,80) + '…'"></div>
              <div class="ip-flag-sub" x-text="(p.source_a_name ?? '?') + ' vs ' + (p.source_b_name ?? '?') + ' · ' + p.relationship"></div>
            </div>
          </template>
        </div>
      </template>

    </div>

    <!-- ── HYPOTHESES TAB ──────────────────────────────────────────── -->
    <div x-show="$store.intelligence.tab === 'hypotheses' && !$store.intelligence.loading" x-cloak>

      <div class="ip-btn-row" style="margin-bottom:10px;">
        <template x-for="s in ['ACTIVE','PROMOTED','FALSIFIED','SUSPENDED']" :key="s">
          <button class="ip-btn"
                  :class="$store.intelligence.hypStatus === s ? 'cyan' : ''"
                  @click="$store.intelligence.setHypStatus(s)"
                  x-text="s.charAt(0) + s.slice(1).toLowerCase()">
          </button>
        </template>
      </div>

      <template x-if="$store.intelligence.hypotheses.length === 0">
        <div class="ip-empty"><div class="ip-empty-icon">◌</div>No hypotheses</div>
      </template>

      <template x-for="h in $store.intelligence.hypotheses" :key="h.hypothesis_id ?? h.id">
        <div class="ip-card accent">
          <div style="display:flex;align-items:center;gap:7px;margin-bottom:5px;">
            <span style="font-family:var(--font-mono);font-size:9px;color:var(--txt-3);"
                  x-text="'#' + (h.hypothesis_id ?? h.id)"></span>
            <span class="ip-pill" :class="(h.status ?? '').toLowerCase()"
                  x-text="h.status"></span>
            <span style="flex:1;"></span>
            <span class="ip-hyp-conf" x-text="$store.intelligence.fmtConf(h.current_confidence)"></span>
          </div>
          <div class="ip-claim-text" x-text="h.candidate_explanation ?? h.explanation"></div>
          <div class="ip-conf-track">
            <div class="ip-conf-fill" :style="'width:' + $store.intelligence.confBarW(h.current_confidence)"></div>
          </div>
          <div class="ip-claim-meta" style="margin-bottom:5px;">
            <span x-text="'⬛ ' + (h.predictions_generated?.length ?? 0) + ' predictions'"></span>
            <span x-text="'✓ ' + (h.predictions_confirmed ?? 0) + ' confirmed'"></span>
          </div>
          <template x-if="h.status === 'ACTIVE'">
            <div class="ip-btn-row" style="gap:4px;margin-bottom:0;">
              <button class="ip-btn ok"
                      @click="$store.intelligence.promoteHyp(h.hypothesis_id ?? h.id)">Promote</button>
              <button class="ip-btn danger"
                      @click="$store.intelligence.falsifyHyp(h.hypothesis_id ?? h.id)">Falsify</button>
            </div>
          </template>
        </div>
      </template>

    </div>

    <!-- ── PREDICT TAB ─────────────────────────────────────────────── -->
    <div x-show="$store.intelligence.tab === 'predict' && !$store.intelligence.loading" x-cloak>

      <!-- SWARMFISH stats row -->
      <div class="ip-swf-stats">
        <div class="ip-swf-stat">
          <span class="ip-swf-val"
                x-text="$store.intelligence.swfSessionsTotal > 0
                         ? $store.intelligence.swfSessionsTotal
                         : '—'"></span>
          <span class="ip-swf-lbl">sessions</span>
        </div>
        <div class="ip-swf-stat">
          <span class="ip-swf-val"
                x-text="$store.intelligence.swfSessions.length > 0
                         ? Math.round(($store.intelligence.swfSessions[0]?.consensus_confidence ?? 0) * 100) + '%'
                         : '—'"></span>
          <span class="ip-swf-lbl">last consensus</span>
        </div>
        <div class="ip-swf-stat">
          <span class="ip-swf-val"
                x-text="$store.intelligence.swfProfiles.length > 0
                         ? $store.intelligence.swfProfiles.length
                         : '—'"></span>
          <span class="ip-swf-lbl">committee</span>
        </div>
      </div>

      <!-- Run controls -->
      <div class="ip-btn-row" style="margin-bottom:12px;">
        <select class="ip-select" x-model="$store.intelligence.predictTopic"
                style="flex:1;">
          <option value="">— Select topic —</option>
          <template x-for="t in $store.intelligence.topics" :key="t.tag ?? t">
            <option :value="t.tag ?? t" x-text="t.tag ?? t"></option>
          </template>
        </select>
        <button class="ip-btn cyan"
                :disabled="$store.intelligence.swfRunning || !$store.intelligence.predictTopic"
                @click="$store.intelligence.runPredict()">
          <template x-if="$store.intelligence.swfRunning">
            <span class="ip-spin"></span>
          </template>
          <template x-if="!$store.intelligence.swfRunning">
            <span>▶ Run</span>
          </template>
        </button>
      </div>

      <!-- Committee working state -->
      <template x-if="$store.intelligence.swfRunning">
        <div class="ip-committee-working">
          <span class="ip-spin" style="width:18px;height:18px;border-width:2px;"></span>
          <div class="ip-committee-status">committee deliberating…</div>
        </div>
      </template>

      <!-- Consensus verdict — committee centerpiece -->
      <template x-if="$store.intelligence.swfConsensus && !$store.intelligence.swfRunning">
        <div class="ip-consensus">
          <div class="ip-consensus-top">
            <div class="ip-consensus-val"
                 x-text="$store.intelligence.fmtConf($store.intelligence.swfConsensus.confidence)">
            </div>
            <div class="ip-consensus-meta">
              <div class="ip-consensus-lbl">Committee Verdict</div>
              <div class="ip-consensus-range"
                   x-text="'Range '
                     + Math.round(($store.intelligence.swfConsensus.range_low ?? 0)*100)
                     + '–'
                     + Math.round(($store.intelligence.swfConsensus.range_high ?? 0)*100) + '%'">
              </div>
              <!-- Meta-confidence + disagreement gauges -->
              <div class="ip-gauge-row" x-show="$store.intelligence.swfConsensus.meta">
                <span class="ip-gauge-lbl">meta</span>
                <span class="ip-gauge-val" style="width:auto;flex:1;text-align:left;letter-spacing:.08em;"
                      x-text="$store.intelligence.swfConsensus.meta"></span>
              </div>
              <div class="ip-gauge-row" x-show="$store.intelligence.swfConsensus.disagreement != null">
                <span class="ip-gauge-lbl">split</span>
                <div class="ip-gauge"><div class="ip-gauge-fill warn"
                     :style="'width:' + $store.intelligence.confBarW($store.intelligence.swfConsensus.disagreement)"></div></div>
                <span class="ip-gauge-val" x-text="$store.intelligence.fmtConf($store.intelligence.swfConsensus.disagreement)"></span>
              </div>
            </div>
          </div>
          <div class="ip-consensus-brief" x-show="$store.intelligence.swfConsensus.brief"
               x-text="$store.intelligence.swfConsensus.brief"></div>
          <div class="ip-dissent" x-show="($store.intelligence.swfConsensus.dissenters ?? []).length > 0">
            <span class="ip-dissent-lbl">⚠ dissent</span>
            <span class="ip-dissent-names"
                  x-text="($store.intelligence.swfConsensus.dissenters ?? [])
                            .map(x => (x && x.profile_name) ? x.profile_name : x).join(', ')"></span>
          </div>
        </div>
      </template>

      <!-- Committee nodes — MAGI-style assessment grid, staggered reveal -->
      <template x-if="$store.intelligence.swfProfiles.length > 0 && !$store.intelligence.swfRunning">
        <div class="ip-section">
          <div class="ip-section-hdr">
            <span class="ip-section-lbl">Committee</span>
            <span class="ip-section-count" x-text="$store.intelligence.swfProfiles.length + ' nodes'"></span>
          </div>
          <div class="ip-node-grid">
            <template x-for="(p, i) in $store.intelligence.swfProfiles" :key="p.assessment_id ?? p.profile_name">
              <div class="ip-node" :class="p.error ? 'err' : ''"
                   :style="'animation-delay:' + (i * 70) + 'ms'">
                <div class="ip-node-hdr">
                  <span class="ip-node-name" x-text="p.profile_name"></span>
                  <span class="ip-node-conf"
                        x-text="p.error ? '——' : $store.intelligence.fmtConf(p.confidence)"></span>
                </div>
                <div class="ip-node-bar" x-show="!p.error">
                  <div class="ip-node-bar-fill" :style="'width:' + $store.intelligence.confBarW(p.confidence)"></div>
                </div>
                <div class="ip-node-verdict" x-show="p.prediction" x-text="p.prediction"></div>
                <div class="ip-node-reason" x-text="p.reasoning_summary ?? p.prediction ?? p.error ?? ''"></div>
                <div class="ip-node-tags">
                  <span class="ip-node-tag cap" x-show="p.confidence_capped">capped</span>
                  <span class="ip-node-tag err" x-show="p.error">error</span>
                </div>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- Session history -->
      <template x-if="$store.intelligence.swfSessions.length > 0 && !$store.intelligence.swfRunning">
        <div class="ip-section">
          <div class="ip-section-hdr"><span class="ip-section-lbl">Recent Sessions</span></div>
          <div class="ip-card" style="padding:6px 10px;">
            <template x-for="s in $store.intelligence.swfSessions.slice(0,8)" :key="s.id">
              <div class="ip-session-row">
                <span class="ip-session-q"
                      x-text="s.question ?? '—'"></span>
                <span class="ip-session-conf"
                      x-text="s.consensus_confidence != null
                               ? Math.round(s.consensus_confidence * 100) + '%'
                               : '—'"></span>
                <span class="ip-session-date"
                      x-text="$store.intelligence.fmtDate(s.created_at)"></span>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- Empty state -->
      <template x-if="$store.intelligence.swfProfiles.length === 0
                       && $store.intelligence.swfSessions.length === 0
                       && !$store.intelligence.swfRunning">
        <div class="ip-empty">
          <div class="ip-empty-icon">◎</div>
          Select a topic and run the committee
        </div>
      </template>

    </div>

    <!-- ═══ CALIBRATE TAB ═══════════════════════════════════════════ -->
    <div x-show="$store.intelligence.tab === 'calibrate' && !$store.intelligence.loading" x-cloak>

      <!-- Track-record summary -->
      <div class="ip-swf-stats">
        <div class="ip-swf-stat">
          <span class="ip-swf-val"
                x-text="$store.intelligence.swfCalibration?.session_count ?? '—'"></span>
          <span class="ip-swf-lbl">sessions</span>
        </div>
        <div class="ip-swf-stat">
          <span class="ip-swf-val"
                x-text="$store.intelligence.swfCalibration?.scored_session_count ?? '—'"></span>
          <span class="ip-swf-lbl">scored</span>
        </div>
        <div class="ip-swf-stat">
          <span class="ip-swf-val"
                x-text="$store.intelligence.swfCalProfiles.length || '—'"></span>
          <span class="ip-swf-lbl">profiles</span>
        </div>
      </div>

      <!-- Per-profile calibration ledger (Brier = lower is better) -->
      <template x-if="($store.intelligence.swfCalibration?.scored_session_count ?? 0) > 0
                       && $store.intelligence.swfCalProfiles.length > 0">
        <div class="ip-section">
          <div class="ip-section-hdr">
            <span class="ip-section-lbl">Profile Calibration</span>
            <span class="ip-section-count">Brier ↓ better</span>
          </div>
          <template x-for="(p, i) in $store.intelligence.swfCalProfiles" :key="p.name">
            <div class="ip-cal-row" :class="'b-' + $store.intelligence.brierBand(p.avg_brier)"
                 :style="'animation-delay:' + (i * 50) + 'ms'">
              <span class="ip-cal-name" x-text="p.name"></span>
              <div class="ip-cal-metrics">
                <span class="ip-cal-brier"
                      x-text="p.avg_brier != null ? p.avg_brier.toFixed(3) : 'n/a'"></span>
                <span class="ip-cal-acc"
                      x-text="p.avg_accuracy != null
                               ? Math.round(p.avg_accuracy * 100) + '% acc'
                               : '—'"></span>
                <span class="ip-cal-n" x-text="(p.n_scored ?? 0) + ' rec'"></span>
              </div>
            </div>
          </template>
        </div>
      </template>

      <!-- Empty / pre-calibration state -->
      <template x-if="!$store.intelligence.swfCalibration
                       || ($store.intelligence.swfCalibration?.scored_session_count ?? 0) === 0">
        <div class="ip-empty">
          <div class="ip-empty-icon">⊙</div>
          No scored outcomes yet — calibration accrues as hypotheses resolve.
        </div>
      </template>

    </div>

  </div><!-- /ip-content -->

  <!-- ── Toast ───────────────────────────────────────────────────── -->
  <template x-if="$store.intelligence.toast">
    <div class="ip-toast" :class="$store.intelligence.toast.type"
         x-text="$store.intelligence.toast.msg">
    </div>
  </template>

</div><!-- /ip -->

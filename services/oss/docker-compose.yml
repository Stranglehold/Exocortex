version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: oss_postgres
    environment:
      POSTGRES_DB: oss
      POSTGRES_USER: oss_admin
      POSTGRES_PASSWORD: ${OSS_DB_PASSWORD:-oss_admin_dev_password}
    volumes:
      - oss_postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oss_admin -d oss"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  oss:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oss_app
    environment:
      # Application connects as oss_app — non-superuser with REVOKE on audit_log.
      # Run ./install.sh --migrate first to create the oss_app role.
      # oss_admin is admin-only: used by migrations, never by the running service.
      OSS_DB_URL: postgresql://oss_app:${OSS_APP_DB_PASSWORD:-oss_app_dev_password}@postgres:5432/oss
      OSS_APP_DB_PASSWORD: ${OSS_APP_DB_PASSWORD:-oss_app_dev_password}
      OSS_LLM_URL: ${OSS_LLM_URL:-http://host.docker.internal:1234/v1}
      OSS_LLM_MODEL: ${OSS_LLM_MODEL:-}
      # Ingest LLM — auto-discovers from LM Studio /v1/models if not set explicitly.
      OSS_LLM_URL_INGEST: ${OSS_LLM_URL_INGEST:-http://host.docker.internal:1234/v1}
      OSS_LLM_MODEL_INGEST: ${OSS_LLM_MODEL_INGEST:-}
      OSS_INGEST_WORKERS: ${OSS_INGEST_WORKERS:-3}
      OSS_ANALYST_TOKEN: ${OSS_ANALYST_TOKEN:-dev_analyst_token}
      OSS_EMBEDDING_MODEL: ${OSS_EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      OSS_INGEST_INTERVAL_MINUTES: ${OSS_INGEST_INTERVAL_MINUTES:-30}
      OSS_INGEST_PAUSED: ${OSS_INGEST_PAUSED:-true}
      # SWARMFISH bridge — V1 standalone (STOPPED, kept for reference)
      SWARMFISH_BASE_URL: ${SWARMFISH_BASE_URL:-http://host.docker.internal:7732}
      SWARMFISH_ANALYST_TOKEN: ${SWARMFISH_ANALYST_TOKEN:-dev_analyst_token}
      # SWARMFISH V2: Agent Zero plugin — set to Agent Zero base URL to enable calibration.
      # Port changes on every docker restart: docker port exocortex_v17 | grep "80/"
      # API key: docker exec exocortex_v17 /opt/venv-a0/bin/python3 -c "import sys; sys.path.insert(0,'/a0/python'); sys.path.insert(0,'/a0'); from helpers.settings import create_auth_token; print(create_auth_token())"
      SWARMFISH_V2_URL: ${SWARMFISH_V2_URL:-}
      SWARMFISH_V2_API_KEY: ${SWARMFISH_V2_API_KEY:-}
      # X/Twitter cookie auth — set these after creating your X account.
      # Get values: log into x.com → DevTools → Application → Cookies → twitter.com
      # Copy auth_token and ct0 cookie values here.
      X_AUTH_TOKEN: ${X_AUTH_TOKEN:-}
      X_CT0_TOKEN: ${X_CT0_TOKEN:-}
    ports:
      - "7731:7731"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - oss_faiss_data:/app/data/faiss
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  oss_postgres_data:
  oss_faiss_data:

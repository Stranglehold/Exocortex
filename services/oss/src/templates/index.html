<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSS — Operational Signal Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body x-data="app()" x-init="init()">

<!-- ── Toast ──────────────────────────────────────────────────────── -->
<div class="toast" :class="[toast.type, toast.visible ? 'visible' : '']">
  <span x-text="toast.message"></span>
</div>

<!-- ── Header ─────────────────────────────────────────────────────── -->
<header class="app-header">
  <div class="header-brand">
    <span class="brand-sigil">◈</span>
    <div>
      <div class="brand-name">OSS</div>
      <div class="brand-sub">Operational Signal Store</div>
    </div>
  </div>

  <div class="header-controls">
    <!-- Ingest status + controls -->
    <div class="control-group">
      <span class="ingest-pill instant" :class="ingestPaused ? 'paused' : 'running'">
        <span class="status-dot"></span>
        <span x-text="ingestPaused ? 'PAUSED' : 'LIVE'"></span>
      </span>
      <button class="btn btn-sm"
              x-show="!ingestPaused"
              @click="pauseIngest()">Pause</button>
      <button class="btn btn-sm btn-ok"
              x-show="ingestPaused"
              @click="resumeIngest()">▶ Resume</button>
      <button class="btn btn-sm"
              :disabled="ingestRunning"
              @click="runIngestNow()"
              x-text="ingestRunning ? 'Running…' : '⟳ Run Now'">
      </button>
    </div>

    <div class="header-divider"></div>

    <!-- Health summary -->
    <div class="control-group" x-show="health">
      <span class="health-stat">
        <span class="mono" x-text="(health?.claims?.staged ?? 0).toLocaleString()"></span>
        <span class="dim">staged</span>
      </span>
      <span class="health-stat">
        <span class="mono ok" x-text="(health?.claims?.promoted ?? 0).toLocaleString()"></span>
        <span class="dim">promoted</span>
      </span>
      <span class="health-stat"
            :class="(health?.source_health?.failing ?? 0) > 0 ? 'danger' : ''">
        <span class="mono" x-text="health?.sources_count ?? 0"></span>
        <span class="dim">sources</span>
      </span>
    </div>

    <div class="header-divider"></div>

    <!-- Operator state badge -->
    <span class="operator-badge"
          :class="(operatorState?.alert_level ?? 'nominal').toLowerCase()"
          x-text="operatorState?.alert_level ?? 'NOMINAL'"></span>
  </div>
</header>

<!-- ── Tab Nav ─────────────────────────────────────────────────────── -->
<nav class="tab-nav">
  <button class="tab-btn" :class="tab === 'feed'        ? 'active' : ''" @click="switchTab('feed')">Feed</button>
  <button class="tab-btn" :class="tab === 'triage'      ? 'active' : ''" @click="switchTab('triage')">Triage</button>
  <button class="tab-btn" :class="tab === 'ledger'      ? 'active' : ''" @click="switchTab('ledger')">Ledger</button>
  <button class="tab-btn" :class="tab === 'analysis'    ? 'active' : ''" @click="switchTab('analysis')">Analysis</button>
  <button class="tab-btn" :class="tab === 'hypotheses'  ? 'active' : ''" @click="switchTab('hypotheses')">Hypotheses</button>
  <button class="tab-btn" :class="tab === 'predict'     ? 'active' : ''" @click="switchTab('predict')">
    <span>Predict</span>
    <span class="tab-badge">SWARMFISH</span>
  </button>
  <div class="tab-filler"></div>
  <div class="topic-selector">
    <span class="dim mono" style="font-size:11px;">Topic:</span>
    <select class="select-sm" x-model="globalTopic" @change="onTopicChange()">
      <option value="">— All —</option>
      <template x-for="t in topics" :key="t.tag ?? t">
        <option :value="t.tag ?? t" x-text="t.tag ?? t"></option>
      </template>
    </select>
  </div>
</nav>

<!-- ── Main Content ────────────────────────────────────────────────── -->
<main class="app-main">

  <!-- Error banner -->
  <div class="error-banner" x-show="error">
    <span>⚠</span>
    <span x-text="error"></span>
    <button @click="error = null">✕</button>
  </div>

  <!-- ── FEED TAB ───────────────────────────────────────────────────── -->
  <div class="view" :class="tab === 'feed' ? 'active' : ''">
    <div class="view-header">
      <h2 class="view-title">Signal Feed</h2>
      <span class="view-subtitle" x-text="feed.length.toLocaleString() + ' claims'"></span>
      <div class="view-controls">
        <select class="select-sm" x-model="feedTrustFilter" @change="renderFeed()">
          <option value="">All trust levels</option>
          <option value="STAGED">Staged</option>
          <option value="PROMOTED">Promoted</option>
        </select>
        <button class="btn btn-sm" @click="loadFeed()">↻ Refresh</button>
      </div>
    </div>

    <div class="claim-grid">
      <template x-if="feed.length === 0 && !loading">
        <div class="empty-state">No claims match the current filter</div>
      </template>
      <template x-for="c in feedDisplay" :key="c.id">
        <article class="claim-card">
          <div class="claim-header">
            <span class="source-name" x-text="c.source_name ?? '—'"></span>
            <span class="claim-date mono" x-text="fmtDate(c.published_at ?? c.extracted_at)"></span>
            <span class="trust-pill" :class="(c.trust_level ?? '').toLowerCase()"
                  x-text="c.trust_level"></span>
            <span class="technique-pill" x-text="techniqueLabel(c.technique_class)"></span>
          </div>
          <p class="claim-text" x-text="c.claim_text"></p>
          <div class="claim-footer" x-show="c.article_url">
            <a :href="c.article_url" target="_blank" class="source-link">↗ <span x-text="c.article_title ?? 'source'"></span></a>
          </div>
        </article>
      </template>
    </div>
  </div>

  <!-- ── TRIAGE TAB ─────────────────────────────────────────────────── -->
  <div class="view" :class="tab === 'triage' ? 'active' : ''">
    <div class="view-header">
      <h2 class="view-title">Triage</h2>
      <span class="view-subtitle" x-text="staged.length.toLocaleString() + ' staged'"></span>
      <div class="view-controls">
        <button class="btn btn-sm" @click="selectAll()">Select All</button>
        <button class="btn btn-sm" @click="clearSel()">Clear</button>
        <button class="btn btn-sm btn-ok"
                :disabled="triageSel.length === 0"
                @click="bulkPromote()">
          ✓ Promote (<span x-text="triageSel.length"></span>)
        </button>
      </div>
    </div>

    <template x-if="staged.length === 0 && !loading">
      <div class="empty-state">No staged claims for this topic</div>
    </template>

    <div class="claim-grid">
      <template x-for="c in staged" :key="c.id">
        <article class="claim-card triage-card" :class="isSel(c.id) ? 'selected' : ''">
          <div style="display:flex;gap:10px;align-items:flex-start;">
            <input type="checkbox" class="triage-check"
                   :checked="isSel(c.id)"
                   @change="toggleSel(c.id)">
            <div style="flex:1;min-width:0;">
              <div class="claim-header">
                <span class="source-name" x-text="c.source_name ?? '—'"></span>
                <span class="claim-date mono" x-text="fmtDate(c.published_at ?? c.extracted_at)"></span>
                <span class="technique-pill" x-text="techniqueLabel(c.technique_class)"></span>
                <span class="conf-val mono"
                      x-show="c.staging_confidence != null"
                      x-text="fmtConf(c.staging_confidence)"></span>
              </div>
              <p class="claim-text" x-text="c.claim_text"></p>
            </div>
          </div>
        </article>
      </template>
    </div>
  </div>

  <!-- ── LEDGER TAB ─────────────────────────────────────────────────── -->
  <div class="view" :class="tab === 'ledger' ? 'active' : ''">
    <div class="view-header">
      <h2 class="view-title">Promoted Ledger</h2>
      <span class="view-subtitle" x-text="ledger.length.toLocaleString() + ' promoted'"></span>
      <div class="view-controls">
        <button class="btn btn-sm" @click="loadLedger()">↻ Refresh</button>
      </div>
    </div>

    <div class="claim-grid">
      <template x-if="ledger.length === 0 && !loading">
        <div class="empty-state">No promoted claims</div>
      </template>
      <template x-for="c in ledger" :key="c.id">
        <article class="claim-card">
          <div class="claim-header">
            <span class="source-name" x-text="c.source_name ?? '—'"></span>
            <span class="cluster-tag" x-text="c.cluster ?? '—'"></span>
            <span class="claim-date mono" x-text="fmtDate(c.published_at ?? c.extracted_at)"></span>
            <span class="trust-pill promoted">PROMOTED</span>
            <span class="technique-pill" x-text="techniqueLabel(c.technique_class)"></span>
          </div>
          <p class="claim-text" x-text="c.claim_text"></p>
          <div class="claim-footer" x-show="c.article_url">
            <a :href="c.article_url" target="_blank" class="source-link">
              ↗ <span x-text="c.article_title ?? c.article_url"></span>
            </a>
          </div>
        </article>
      </template>
    </div>
  </div>

  <!-- ── ANALYSIS TAB ───────────────────────────────────────────────── -->
  <div class="view" :class="tab === 'analysis' ? 'active' : ''">
    <div class="view-header">
      <h2 class="view-title">Analysis</h2>
      <span class="view-subtitle" x-text="globalTopic || 'Select a topic'"></span>
      <div class="view-controls">
        <button class="btn btn-sm btn-cyan"
                :disabled="!globalTopic || loading"
                @click="loadAnalysis()">
          Analyze
        </button>
      </div>
    </div>

    <template x-if="!globalTopic">
      <div class="empty-state">Select a topic from the nav to enable analysis</div>
    </template>

    <div class="analysis-grid" x-show="globalTopic">

      <!-- DRIFT -->
      <section class="analysis-card">
        <div class="analysis-card-header">
          <span class="analysis-card-title">Narrative Drift</span>
          <span class="analysis-badge cyan" x-text="(drift?.claims?.length ?? 0) + ' claims / 72h'"></span>
        </div>
        <template x-if="drift">
          <div>
            <div class="metric-row">
              <span class="metric-label">Contradictions</span>
              <span class="metric-val" :class="(drift.contradiction_count ?? 0) > 0 ? 'danger' : 'ok'"
                    x-text="drift.contradiction_count ?? 0"></span>
            </div>
            <div class="metric-row">
              <span class="metric-label">Silent retractions</span>
              <span class="metric-val" :class="(drift.silent_retcon_count ?? 0) > 0 ? 'warn' : 'ok'"
                    x-text="drift.silent_retcon_count ?? 0"></span>
            </div>
          </div>
        </template>
        <template x-if="!drift">
          <div class="empty-state" style="padding:20px 0;">Run analysis to load</div>
        </template>
      </section>

      <!-- SILENCE -->
      <section class="analysis-card">
        <div class="analysis-card-header">
          <span class="analysis-card-title">Silence Flags</span>
          <span class="analysis-badge" :class="(silence?.total ?? 0) > 0 ? 'warn' : 'ok'"
                x-text="silence?.total ?? 0"></span>
        </div>
        <template x-if="silence && silence.total > 0">
          <div class="flag-list">
            <template x-for="f in silence.flags.slice(0,6)" :key="f.id">
              <div class="flag-item">
                <span class="flag-element" x-text="f.element"></span>
                <span class="flag-meta mono"
                      x-text="'absent: ' + (f.absent_from_clusters ?? []).join(', ')"></span>
              </div>
            </template>
            <div x-show="silence.total > 6" class="flag-meta"
                 x-text="'+ ' + (silence.total - 6) + ' more'"></div>
          </div>
        </template>
        <template x-if="!silence || silence.total === 0">
          <div class="empty-state" style="padding:20px 0;">
            <span x-text="!silence ? 'Run analysis to load' : 'No silence flags'"></span>
          </div>
        </template>
      </section>

      <!-- ACTIVATION -->
      <section class="analysis-card">
        <div class="analysis-card-header">
          <span class="analysis-card-title">Activation Patterns</span>
          <span class="analysis-badge" :class="(activation?.patterns?.length ?? 0) > 0 ? 'danger' : 'ok'"
                x-text="activation?.patterns?.length ?? 0"></span>
        </div>
        <template x-if="activation && activation.patterns?.length > 0">
          <div class="flag-list">
            <template x-for="p in activation.patterns.slice(0,4)" :key="p.id">
              <div class="flag-item">
                <span class="flag-element" x-text="p.claim_pattern ?? p.description"></span>
                <span class="flag-meta mono"
                      x-text="'spread: ' + (p.cluster_spread ?? '?') + ' · ' + p.technique_class"></span>
              </div>
            </template>
          </div>
        </template>
        <template x-if="!activation || !activation.patterns?.length">
          <div class="empty-state" style="padding:20px 0;">
            <span x-text="!activation ? 'Run analysis to load' : 'No activation patterns'"></span>
          </div>
        </template>
      </section>

      <!-- CONTRADICTIONS -->
      <section class="analysis-card">
        <div class="analysis-card-header">
          <span class="analysis-card-title">Contradictions</span>
          <span class="analysis-badge" :class="contradictions.length > 0 ? 'danger' : 'ok'"
                x-text="contradictions.length"></span>
        </div>
        <template x-if="contradictions.length > 0">
          <div class="contradiction-list">
            <template x-for="p in contradictions.slice(0,4)" :key="p.id">
              <div class="contradiction-item">
                <div class="contradiction-rel mono" x-text="p.relationship"></div>
                <div class="contradiction-a" x-text="(p.claim_a_text ?? '').substring(0, 100) + '…'"></div>
                <div class="contradiction-vs">vs.</div>
                <div class="contradiction-b" x-text="(p.claim_b_text ?? '').substring(0, 100) + '…'"></div>
                <div class="flag-meta mono" x-text="p.source_name + ' · ' + fmtDate(p.flagged_at)"></div>
              </div>
            </template>
          </div>
        </template>
        <template x-if="contradictions.length === 0">
          <div class="empty-state" style="padding:20px 0;">No contradictions loaded</div>
        </template>
      </section>

    </div>
  </div>

  <!-- ── HYPOTHESES TAB ─────────────────────────────────────────────── -->
  <div class="view" :class="tab === 'hypotheses' ? 'active' : ''">
    <div class="view-header">
      <h2 class="view-title">Hypotheses</h2>
      <span class="view-subtitle">Chamberlin multiple-hypothesis method</span>
      <div class="view-controls">
        <template x-for="s in ['ACTIVE','PROMOTED','FALSIFIED','SUSPENDED']" :key="s">
          <button class="btn btn-sm" :class="hypStatus === s ? 'btn-cyan' : ''"
                  @click="setHypStatus(s)" x-text="s.charAt(0) + s.slice(1).toLowerCase()">
          </button>
        </template>
      </div>
    </div>

    <template x-if="hypotheses.length === 0 && !loading">
      <div class="empty-state">No <span x-text="hypStatus.toLowerCase()"></span> hypotheses</div>
    </template>

    <div class="hyp-grid">
      <template x-for="h in hypotheses" :key="h.hypothesis_id ?? h.id">
        <article class="hyp-card ai-content">
          <div class="hyp-card-header">
            <span class="hyp-id mono" x-text="'#' + (h.hypothesis_id ?? h.id)"></span>
            <span class="status-pill" :class="(h.status ?? '').toLowerCase()"
                  x-text="h.status"></span>
            <div class="hyp-header-spacer"></div>
            <span class="hyp-conf mono" x-text="fmtConf(h.current_confidence)"></span>
          </div>

          <p class="hyp-explanation" x-text="h.candidate_explanation ?? h.explanation"></p>

          <!-- Confidence bar -->
          <div class="conf-bar-track">
            <div class="conf-bar-fill" :style="'width:' + confBarW(h.current_confidence)"></div>
          </div>

          <!-- Stats row -->
          <div class="hyp-stats mono">
            <span x-text="(h.predictions_generated?.length ?? 0) + ' predictions'"></span>
            <span>·</span>
            <span x-text="(h.predictions_confirmed ?? 0) + ' confirmed'"></span>
            <span>·</span>
            <span x-text="'obs #' + (h.observation_id ?? '—')"></span>
          </div>

          <!-- Falsification evidence (for FALSIFIED) -->
          <template x-if="h.status === 'FALSIFIED' && h.falsification_evidence">
            <div class="falsification-evidence">
              <span class="mono" style="font-size:10px;color:var(--danger);">FALSIFIED BY:</span>
              <p x-text="h.falsification_evidence"></p>
            </div>
          </template>

          <!-- Actions (only for ACTIVE) -->
          <template x-if="h.status === 'ACTIVE'">
            <div class="hyp-actions">
              <button class="btn btn-sm btn-ok"
                      @click="promoteHyp(h.hypothesis_id ?? h.id)">Promote</button>
              <button class="btn btn-sm btn-danger"
                      @click="falsifyHyp(h.hypothesis_id ?? h.id)">Falsify</button>
              <button class="btn btn-sm"
                      @click="suspendHyp(h.hypothesis_id ?? h.id)">Suspend</button>
            </div>
          </template>

          <!-- Timestamps -->
          <div class="hyp-meta mono">
            <span x-text="'Created: ' + fmtDate(h.created_at)"></span>
            <template x-if="h.falsified_at">
              <span x-text="' · Falsified: ' + fmtDate(h.falsified_at)"></span>
            </template>
          </div>
        </article>
      </template>
    </div>
  </div>

  <!-- ── PREDICT TAB (SWARMFISH) ────────────────────────────────────── -->
  <div class="view" :class="tab === 'predict' ? 'active' : ''">
    <div class="view-header">
      <h2 class="view-title">SWARMFISH</h2>
      <span class="view-subtitle">Structured committee prediction</span>
      <div class="view-controls">
        <select class="select-sm" x-model="predictTopic">
          <option value="">— Select topic —</option>
          <template x-for="t in topics" :key="t.tag ?? t">
            <option :value="t.tag ?? t" x-text="t.tag ?? t"></option>
          </template>
        </select>
        <button class="btn btn-cyan"
                :disabled="swfRunning || !predictTopic"
                @click="runPredict()">
          <span x-show="swfRunning" class="spinner"></span>
          <span x-text="swfRunning ? 'Running…' : '▶ Run Predict'"></span>
        </button>
      </div>
    </div>

    <div class="predict-layout">

      <!-- Consensus panel -->
      <template x-if="swfConsensus">
        <div class="consensus-panel">
          <div class="consensus-header">
            <div class="consensus-val"
                 x-text="Math.round((swfConsensus.consensus_probability ?? 0) * 100) + '%'">
            </div>
            <div class="consensus-meta">
              <div class="consensus-label mono">CONSENSUS</div>
              <div class="consensus-range mono"
                   x-text="'Range: ' + Math.round((swfConsensus.range_low ?? 0)*100)
                            + '–' + Math.round((swfConsensus.range_high ?? 0)*100) + '%'">
              </div>
              <div class="consensus-confidence mono"
                   x-text="swfConsensus.meta_confidence ?? ''"></div>
            </div>
          </div>
          <template x-if="swfConsensus.operator_brief">
            <div class="consensus-brief ai-content">
              <div class="ai-label mono">OPERATOR BRIEF</div>
              <p x-text="swfConsensus.operator_brief"></p>
            </div>
          </template>
          <div class="consensus-actions">
            <button class="btn btn-sm btn-cyan"
                    @click="postConsensusAsHypothesis()"
                    x-show="swfConsensus.operator_brief">
              Post as Hypothesis
            </button>
          </div>
        </div>
      </template>

      <!-- Profile cards grid -->
      <div class="profile-grid">
        <template x-if="swfProfiles.length === 0 && !swfRunning">
          <div class="empty-state">
            Select a topic and run predict to generate committee assessments
          </div>
        </template>

        <template x-if="swfRunning && swfProfiles.length === 0">
          <div class="empty-state">
            <span class="spinner"></span>
            Querying profiles…
          </div>
        </template>

        <template x-for="p in swfProfiles" :key="p.profile_id ?? p.name">
          <div class="profile-card">
            <div class="profile-card-header">
              <div>
                <div class="profile-name mono" x-text="p.profile_name ?? p.name"></div>
                <div class="profile-meta mono" x-text="p.profile_type ?? ''"></div>
              </div>
              <div class="profile-conf-block">
                <div class="profile-conf" x-text="Math.round((p.probability ?? 0) * 100) + '%'"></div>
              </div>
            </div>

            <!-- Confidence bar -->
            <div class="conf-bar-track" style="margin:8px 0;">
              <div class="conf-bar-fill" :style="'width:' + Math.round((p.probability ?? 0)*100) + '%'"></div>
            </div>

            <!-- Brief -->
            <div class="profile-brief ai-content" x-show="p.brief ?? p.reasoning">
              <div class="ai-label mono">ASSESSMENT</div>
              <p x-text="p.brief ?? p.reasoning"></p>
            </div>

            <!-- Key factors -->
            <template x-if="p.key_factors?.length">
              <div class="profile-factors">
                <div class="ai-label mono" style="margin-bottom:6px;">KEY FACTORS</div>
                <template x-for="f in p.key_factors" :key="f">
                  <div class="factor-item" x-text="'· ' + f"></div>
                </template>
              </div>
            </template>

            <!-- Dissent -->
            <template x-if="p.dissent">
              <div class="profile-dissent">
                <span class="mono" style="font-size:10px;color:var(--warn);">DISSENT:</span>
                <span x-text="p.dissent"></span>
              </div>
            </template>
          </div>
        </template>
      </div>

    </div><!-- /predict-layout -->
  </div>

  <!-- ── Loading overlay ────────────────────────────────────────────── -->
  <div class="loading-bar" :class="loading ? 'active' : ''"></div>

</main><!-- /app-main -->

<script>
const OSS_URL = "";  // same-origin
const TOKEN   = "dev_analyst_token";

async function ossGet(path) {
  const r = await fetch(OSS_URL + path, {
    headers: { "X-Analyst-Token": TOKEN },
  });
  if (!r.ok) throw new Error(`${r.status} ${r.statusText} — ${path}`);
  return r.json();
}

async function ossPost(path, body = {}) {
  const r = await fetch(OSS_URL + path, {
    method: "POST",
    headers: { "X-Analyst-Token": TOKEN, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error(`${r.status} ${r.statusText} — ${path}`);
  return r.json();
}

function app() {
  return {
    // ── Core ──────────────────────────────────────────────────────────
    tab:          "feed",
    loading:      false,
    error:        null,
    toast:        { visible: false, message: "", type: "info" },
    _toastTimer:  null,
    _pollTimer:   null,

    // ── Shared ────────────────────────────────────────────────────────
    health:        null,
    topics:        [],
    globalTopic:   "",
    operatorState: null,
    ingestPaused:  true,
    ingestRunning: false,

    // ── Feed tab ──────────────────────────────────────────────────────
    feed:            [],
    feedDisplay:     [],
    feedTrustFilter: "",

    // ── Triage tab ────────────────────────────────────────────────────
    staged:    [],
    triageSel: [],

    // ── Ledger tab ────────────────────────────────────────────────────
    ledger: [],

    // ── Analysis tab ─────────────────────────────────────────────────
    drift:          null,
    silence:        null,
    activation:     null,
    contradictions: [],

    // ── Hypotheses tab ───────────────────────────────────────────────
    hypotheses: [],
    hypStatus:  "ACTIVE",

    // ── Predict tab ──────────────────────────────────────────────────
    predictTopic: "",
    swfRunning:   false,
    swfProfiles:  [],
    swfConsensus: null,

    // ── Init ──────────────────────────────────────────────────────────

    async init() {
      await this.loadHealth();
      await this.loadTopics();
      await this.loadFeed();
      this._pollTimer = setInterval(() => this.loadHealth(), 60_000);
    },

    // ── Navigation ────────────────────────────────────────────────────

    async switchTab(t) {
      this.tab = t;
      this.error = null;
      const map = {
        feed:        () => this.loadFeed(),
        triage:      () => this.loadStaged(),
        ledger:      () => this.loadLedger(),
        analysis:    () => this.globalTopic ? this.loadAnalysis() : Promise.resolve(),
        hypotheses:  () => this.loadHypotheses(),
        predict:     () => Promise.resolve(),
      };
      await this.wrap(map[t] ?? (() => Promise.resolve()));
    },

    onTopicChange() {
      const refresh = {
        feed:       () => this.loadFeed(),
        triage:     () => this.loadStaged(),
        ledger:     () => this.loadLedger(),
        analysis:   () => this.globalTopic ? this.loadAnalysis() : Promise.resolve(),
        hypotheses: () => this.loadHypotheses(),
      };
      if (refresh[this.tab]) this.wrap(refresh[this.tab].bind(this));
    },

    async wrap(fn) {
      this.loading = true;
      try { await fn(); }
      catch (e) { this.error = e.message; }
      finally { this.loading = false; }
    },

    // ── Health ────────────────────────────────────────────────────────

    async loadHealth() {
      try {
        const d = await ossGet("/api/health");
        this.health       = d;
        this.ingestPaused = d.ingest_paused ?? true;
      } catch (e) {
        console.warn("Health check failed:", e.message);
      }
    },

    async loadTopics() {
      const d    = await ossGet("/api/topics");
      this.topics = d.topics ?? (Array.isArray(d) ? d : []);
    },

    async pauseIngest() {
      await ossPost("/api/ingest/pause");
      this.ingestPaused = true;
      this.notify("Ingest paused", "warn");
    },

    async resumeIngest() {
      await ossPost("/api/ingest/resume");
      this.ingestPaused = false;
      this.notify("Ingest resumed", "ok");
    },

    async runIngestNow() {
      this.ingestRunning = true;
      try {
        await ossPost("/api/ingest/run");
        this.notify("Ingest cycle triggered", "ok");
        setTimeout(() => this.loadHealth(), 4000);
      } finally {
        this.ingestRunning = false;
      }
    },

    // ── Feed ──────────────────────────────────────────────────────────

    async loadFeed() {
      const q  = this.globalTopic ? `&topic=${encodeURIComponent(this.globalTopic)}` : "";
      const d  = await ossGet(`/api/feed?limit=200${q}`);
      this.feed = d.claims ?? (Array.isArray(d) ? d : []);
      this.renderFeed();
    },

    renderFeed() {
      this.feedDisplay = this.feedTrustFilter
        ? this.feed.filter(c => c.trust_level === this.feedTrustFilter)
        : this.feed;
    },

    // ── Triage ────────────────────────────────────────────────────────

    async loadStaged() {
      const q   = this.globalTopic ? `?topic=${encodeURIComponent(this.globalTopic)}&limit=200` : "?limit=200";
      const d   = await ossGet(`/api/feed${q}`);
      const all = d.claims ?? (Array.isArray(d) ? d : []);
      this.staged    = all.filter(c => c.trust_level === "STAGED");
      this.triageSel = [];
    },

    toggleSel(id) {
      const i = this.triageSel.indexOf(id);
      if (i >= 0) this.triageSel.splice(i, 1); else this.triageSel.push(id);
    },
    isSel(id)   { return this.triageSel.includes(id); },
    selectAll() { this.triageSel = this.staged.map(c => c.id); },
    clearSel()  { this.triageSel = []; },

    async bulkPromote() {
      if (!this.triageSel.length) return;
      const ids   = [...this.triageSel];
      const topic = this.globalTopic || null;
      await ossPost("/admin/bulk_promote", { ids, topic });
      this.notify(`${ids.length} claims promoted to ledger`, "ok");
      await this.loadStaged();
    },

    // ── Ledger ────────────────────────────────────────────────────────

    async loadLedger() {
      const q   = this.globalTopic ? `?topic=${encodeURIComponent(this.globalTopic)}&limit=200` : "?limit=200";
      const d   = await ossGet(`/api/feed${q}`);
      const all = d.claims ?? (Array.isArray(d) ? d : []);
      this.ledger = all.filter(c => c.trust_level === "PROMOTED");
    },

    // ── Analysis ─────────────────────────────────────────────────────

    async loadAnalysis() {
      if (!this.globalTopic) return;
      const since72h = new Date(Date.now() - 72 * 3600_000).toISOString();
      const topic    = this.globalTopic;

      const [dr, si, ac, co] = await Promise.allSettled([
        ossPost("/api/drift",          { topic, since: since72h }),
        ossPost("/api/silence",        { topic, since: since72h }),
        ossPost("/api/activation",     { topic, since: since72h }),
        ossPost("/api/contradictions", { topic, analyst_token: TOKEN }),
      ]);

      this.drift         = dr.status === "fulfilled" ? dr.value : null;
      this.silence       = si.status === "fulfilled" ? si.value : null;
      this.activation    = ac.status === "fulfilled" ? ac.value : null;
      this.contradictions = co.status === "fulfilled" ? (co.value.pairs ?? []) : [];
    },

    // ── Hypotheses ────────────────────────────────────────────────────

    async loadHypotheses() {
      const q   = `?status=${this.hypStatus}&limit=50`;
      const d   = await ossGet(`/api/hypotheses${q}`);
      this.hypotheses = d.hypotheses ?? (Array.isArray(d) ? d : []);
    },

    async setHypStatus(s) {
      this.hypStatus = s;
      await this.wrap(() => this.loadHypotheses());
    },

    async promoteHyp(id) {
      await ossPost(`/api/hypothesis/${id}/promote`);
      this.notify(`Hypothesis #${id} promoted`, "ok");
      await this.loadHypotheses();
    },

    async falsifyHyp(id) {
      const ev = window.prompt(`Falsification evidence for hypothesis #${id}:`);
      if (!ev) return;
      await ossPost(`/api/hypothesis/${id}/falsify`, { evidence: ev });
      this.notify(`Hypothesis #${id} falsified`, "warn");
      await this.loadHypotheses();
    },

    async suspendHyp(id) {
      await ossPost(`/api/hypothesis/${id}/suspend`, { reason: "Analyst suspension" });
      this.notify(`Hypothesis #${id} suspended`, "info");
      await this.loadHypotheses();
    },

    // ── Predict (SWARMFISH) ───────────────────────────────────────────

    async runPredict() {
      if (!this.predictTopic) return;
      this.swfRunning  = true;
      this.swfProfiles = [];
      this.swfConsensus = null;
      try {
        const d = await ossPost("/api/swarmfish/predict", { topic: this.predictTopic });
        this.swfProfiles  = d.profiles  ?? [];
        this.swfConsensus = d.consensus ?? null;
      } catch (e) {
        this.error = "SWARMFISH: " + e.message;
      } finally {
        this.swfRunning = false;
      }
    },

    async postConsensusAsHypothesis() {
      if (!this.swfConsensus?.operator_brief) return;
      const obsId = Math.floor(Date.now() / 1000);  // synthetic observation ref
      await ossPost("/api/hypothesis/register", {
        observation_id:      obsId,
        explanation:         this.swfConsensus.operator_brief,
        initial_confidence:  this.swfConsensus.consensus_probability ?? 0.5,
      });
      this.notify("Posted as hypothesis", "ok");
      if (this.tab !== "hypotheses") this.switchTab("hypotheses");
    },

    // ── Formatters ────────────────────────────────────────────────────

    fmtDate(ts) {
      if (!ts) return "—";
      const d = new Date(ts);
      return d.toLocaleDateString("en-US", { month: "short", day: "numeric" })
        + " "
        + d.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit", hour12: false });
    },

    fmtConf(v) { return v != null ? (v * 100).toFixed(0) + "%" : "—"; },

    confBarW(v) { return v != null ? Math.round(v * 100) + "%" : "0%"; },

    techniqueLabel(t) {
      const m = {
        neutral_framing:  "neutral",
        loaded_language:  "loaded",
        false_balance:    "false-bal",
        selective_omit:   "omit",
        fear_appeal:      "fear",
        appeal_to_authority: "authority",
        unclassified:     "unclassed",
      };
      return m[t] ?? t ?? "—";
    },

    notify(msg, type = "info") {
      clearTimeout(this._toastTimer);
      Object.assign(this.toast, { visible: true, message: msg, type });
      this._toastTimer = setTimeout(() => { this.toast.visible = false; }, 3500);
    },
  };
}
</script>

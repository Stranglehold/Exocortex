version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: cp_postgres
    environment:
      POSTGRES_DB: counter_patriots
      POSTGRES_USER: cp_user
      POSTGRES_PASSWORD: ${CP_DB_PASSWORD:-cp_dev_password}
    volumes:
      - cp_postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cp_user -d counter_patriots"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  counter_patriots:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cp_app
    environment:
      CP_DB_URL: postgresql://cp_user:${CP_DB_PASSWORD:-cp_dev_password}@postgres:5432/counter_patriots
      CP_LLM_URL: ${CP_LLM_URL:-http://host.docker.internal:1234/v1}
      CP_LLM_MODEL: ${CP_LLM_MODEL:-qwen2.5-14b-instruct}
      CP_ANALYST_TOKEN: ${CP_ANALYST_TOKEN:-dev_analyst_token}
      CP_EMBEDDING_MODEL: ${CP_EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      CP_INGEST_INTERVAL_MINUTES: ${CP_INGEST_INTERVAL_MINUTES:-30}
    ports:
      - "7731:7731"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - cp_faiss_data:/app/data/faiss
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  cp_postgres_data:
  cp_faiss_data:

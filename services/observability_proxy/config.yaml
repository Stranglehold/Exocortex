# Agent Observability Proxy — config
# Spec: specs/AGENT_OBSERVABILITY_PROXY.md
#
# DEVIATION FROM SPEC (Kestrel, 2026-08-31, verified live):
# The spec lists all three agents on http://localhost:1235/v1. That was true on
# 2026-08-26; it is not true now. Verified this session:
#   :1235  FreeToken  — DOWN, and it binds 127.0.0.1 only, so containers could
#                       never reach it anyway.
#   :1234  LM Studio  — UP, serving ornith-1.5-35b-a3b. This is what Aporia's
#                       preset actually points at after the 2026-08-28 fix.
#   Hermes moved to the Nous API on 2026-08-27 (tencent/hy3:free etc).
#   Vek runs deepseek-v4-flash over the DeepSeek API with an empty api_base.
# Re-verify before trusting any line below — a config is a claim with a date.

proxy:
  listen_port: 1240
  # 127.0.0.1 per spec §7.4 (local-only, nothing leaves the machine).
  #
  # NOTE — this blocks the containerized agents. Vek and Aporia reach the host
  # as host.docker.internal (192.168.65.254 from inside), which a loopback bind
  # refuses. This is the exact failure that made Aporia's utility model
  # unreachable on :1235 for two days. To proxy a container you must set this to
  # 0.0.0.0, which also exposes the port to the LAN. That is a privacy decision
  # the spec already made one way, so it is left as-is and flagged rather than
  # quietly changed. Host-side agents (Hermes) work on loopback today.
  # Jake's call, 2026-08-31: bind 0.0.0.0 so host.docker.internal works —
  # it is what our A0 agents actually reach the host by. Overrides spec §7.4's
  # loopback default; the port is now visible on the LAN.
  listen_host: 0.0.0.0

agents:
  hermes:
    upstream: https://inference-api.nousresearch.com/v1
    workspace: C:/Users/Jake/Documents/swarmfish-ledger
    model_family: qwen3.8
    # Host process (Electron + python backend) — loopback bind is fine.

  aporia:
    upstream: http://127.0.0.1:1234/v1
    workspace: /a0/usr/workdir/workspace
    container: agent-zero-v2
    model_family: ornith
    # Requires listen_host: 0.0.0.0 to be reachable from the container.

  vek:
    # DeepSeek API. api_base is empty in his preset, so litellm supplies the
    # default. Fill in the real base URL before enabling — NOT guessed here.
    upstream: ""
    workspace: /a0/usr/workdir/workspace
    container: VekV2
    model_family: deepseek
    enabled: false

buffer:
  max_turns: 50
  max_memory_mb: 100
  max_age_hours: 2
  persist: false

metrics:
  scaffolding_paper_mode: true

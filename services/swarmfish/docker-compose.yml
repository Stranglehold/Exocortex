version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: swarmfish_postgres
    environment:
      POSTGRES_DB: swarmfish
      POSTGRES_USER: swarmfish_admin
      POSTGRES_PASSWORD: ${SWARMFISH_DB_PASSWORD:-swarmfish_admin_dev_password}
    volumes:
      - swarmfish_postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swarmfish_admin -d swarmfish"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: swarmfish_redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  swarmfish:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swarmfish_app
    environment:
      # Database — app user (non-superuser, created in schema.sql migrations)
      SWARMFISH_DB_URL: postgresql://swarmfish_app:${SWARMFISH_APP_DB_PASSWORD:-swarmfish_app_dev_password}@postgres:5432/swarmfish
      SWARMFISH_APP_DB_PASSWORD: ${SWARMFISH_APP_DB_PASSWORD:-swarmfish_app_dev_password}
      # LLM — shares the LM Studio instance already serving Agent Zero.
      # Point at whatever model is currently loaded — no JIT reload triggered
      # when both systems use the same model name.
      SWARMFISH_LLM_URL: ${SWARMFISH_LLM_URL:-http://host.docker.internal:1234/v1}
      SWARMFISH_LLM_MODEL: ${SWARMFISH_LLM_MODEL:-}
      SWARMFISH_LLM_API_KEY: ${SWARMFISH_LLM_API_KEY:-lm-studio}
      # Historian profile has 6 extra required output fields; reasoning model adds thinking tokens.
      # Investigation 2026-04-14: the reasoning-distilled model uses the majority
      # of its generation budget on <think>...</think> tokens BEFORE emitting JSON.
      # Steady-state gen speed is ~31 tok/sec on a 3090, so 4096 budget takes ~130s
      # worst case and typical profiles land around 2000-2500 tokens / 60-80s.
      # DO NOT LOWER this below 3000 — profiles will truncate mid-thinking and
      # never reach the JSON output stage, breaking the parser.
      SWARMFISH_LLM_MAX_TOKENS: ${SWARMFISH_LLM_MAX_TOKENS:-4096}
      # Per-request timeout. 120s was cutting too close to the structural ~80-130s
      # per-profile baseline. Raised to 180s to give legitimate slow profiles
      # headroom before the client times out. Total wall time per profile with
      # retry-on-JIT-unload: up to 180 + 15 + 180 = 375s worst case.
      SWARMFISH_LLM_TIMEOUT: ${SWARMFISH_LLM_TIMEOUT:-180}
      # Temperature — 0.3 default preserves diversity while keeping JSON outputs
      # structurally stable for the profile schema parser.
      SWARMFISH_LLM_TEMPERATURE: ${SWARMFISH_LLM_TEMPERATURE:-0.3}
      # Redis
      SWARMFISH_REDIS_URL: redis://redis:6379/0
      # Auth
      SWARMFISH_ANALYST_TOKEN: ${SWARMFISH_ANALYST_TOKEN:-dev_analyst_token}
      # OSS bridge
      OSS_BASE_URL: ${OSS_BASE_URL:-http://host.docker.internal:7731}
      OSS_ANALYST_TOKEN: ${OSS_ANALYST_TOKEN:-dev_analyst_token}
      # Monitor loop — set to "true" to enable autonomous hypothesis generation
      SWARMFISH_MONITOR_ENABLED: ${SWARMFISH_MONITOR_ENABLED:-true}
      SWARMFISH_MONITOR_INTERVAL_MINUTES: ${SWARMFISH_MONITOR_INTERVAL_MINUTES:-30}
      SWARMFISH_MONITOR_MIN_CLAIMS: ${SWARMFISH_MONITOR_MIN_CLAIMS:-1}
    ports:
      - "7732:7732"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      # SFA-001 P4.3 persistence fix: /app/data holds monitor_state.json
      # and monitor_pause_state.json. A bind mount here would preserve them
      # across docker compose recreate, not just docker restart.
      - swarmfish_app_data:/app/data
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  swarmfish_postgres_data:
  swarmfish_app_data:
